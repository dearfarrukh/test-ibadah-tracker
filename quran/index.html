function getSelectedQuranLabel(){if(selectedQuranType==="9line")return"9 Line Quran";if(selectedQuranType==="15line")return"15 Line Quran";if(selectedQuranType==="16line")return"16 Line Quran";if(selectedQuranType==="audio")return"Audio Quran";return"15 Line Quran";}
function selectQuranType(type){selectedQuranType=type;localStorage.setItem("selectedQuranType",selectedQuranType);updateQuranTypeButtons();renderCurrentQuranList();}
function updateQuranTypeButtons(){[{id:"quranType9",type:"9line"},{id:"quranType15",type:"15line"},{id:"quranType16",type:"16line"},{id:"quranTypeAudio",type:"audio"}].forEach(function(item){let btn=document.getElementById(item.id);if(btn){btn.classList.toggle("active",item.type===selectedQuranType);}});let text=document.getElementById("selectedQuranTypeText");if(text){text.innerText=getSelectedQuranLabel();}}
function showQuranListMode(mode){selectedListMode=mode;let juzBtn=document.getElementById("toolJuzBtn");let surahBtn=document.getElementById("toolSurahBtn");let favoriteBtn=document.getElementById("toolFavoriteBtn");if(juzBtn)juzBtn.classList.remove("active");if(surahBtn)surahBtn.classList.remove("active");if(favoriteBtn)favoriteBtn.classList.remove("active");if(mode==="juz"&&juzBtn)juzBtn.classList.add("active");if(mode==="surah"&&surahBtn)surahBtn.classList.add("active");if(mode==="favorite"&&favoriteBtn)favoriteBtn.classList.add("active");renderCurrentQuranList();}
function renderCurrentQuranList(){updateQuranTypeButtons();let title=document.getElementById("quranListTitle");let downloadArea=document.getElementById("downloadArea");if(downloadArea)downloadArea.style.display="none";if(selectedListMode==="juz"){if(title)title.innerText="Juz List";renderJuzList();return;}if(selectedListMode==="favorite"){if(title)title.innerText="Favorites";renderFavoriteList();return;}if(title)title.innerText="Surah List";renderSurahList();}
function renderSurahList(){let container=document.getElementById("quranList");if(!container)return;container.innerHTML="";surahData.forEach(function(surah){let page=getSurahStartPageForSelectedQuran(surah.num);let card=document.createElement("button");card.className="quranListCard";card.onclick=function(){openSelectedQuranAtPage(page,surah.num);};card.innerHTML=`<div class="quranListBadge">${surah.num}</div><div class="quranListInfo"><div class="quranListTitle">${surah.en}</div><div class="quranListSub">Page ${page} • ${surah.verses} verses</div></div><div class="quranListArabic">${surah.ar}</div><div class="quranChevron">›</div>`;container.appendChild(card);});}
function renderJuzList(){let container=document.getElementById("quranList");if(!container)return;container.innerHTML="";for(let juzNumber=1;juzNumber<=30;juzNumber++){let page=getJuzStartPageForSelectedQuran(juzNumber);let card=document.createElement("button");card.className="quranListCard";card.onclick=function(){openSelectedQuranAtPage(page,null);};card.innerHTML=`<div class="quranListBadge">${juzNumber}</div><div class="quranListInfo"><div class="quranListTitle">Juz ${juzNumber}</div><div class="quranListSub">Open ${getSelectedQuranLabel()} at Juz ${juzNumber}</div></div><div class="quranListArabic">الجزء ${juzNumber}</div><div class="quranChevron">›</div>`;container.appendChild(card);}}
function renderFavoriteList(){let container=document.getElementById("quranList");if(!container)return;let allBookmarks=getAllQuranBookmarks();let currentTypeBookmarks=allBookmarks.filter(function(item){return getBookmarkTypeForSelectedQuran()===item.type;});container.innerHTML="";if(!currentTypeBookmarks.length){container.innerHTML=`<div class="quranListCard" style="cursor:default;"><div class="quranListBadge">★</div><div class="quranListInfo"><div class="quranListTitle">No favorites yet</div><div class="quranListSub">For now, saved bookmarks will show here later.</div></div></div>`;return;}currentTypeBookmarks.forEach(function(bookmark){let card=document.createElement("button");card.className="quranListCard";card.onclick=function(){openSelectedQuranAtPage(Number(bookmark.page||1),null);};card.innerHTML=`<div class="quranListBadge">★</div><div class="quranListInfo"><div class="quranListTitle">${bookmark.name||"Favorite"}</div><div class="quranListSub">Page ${bookmark.page||1}</div></div><div class="quranChevron">›</div>`;container.appendChild(card);});}
function getBookmarkTypeForSelectedQuran(){if(selectedQuranType==="15line")return"15line";if(selectedQuranType==="16line")return"16line";if(selectedQuranType==="9line")return"9line";if(selectedQuranType==="audio")return"audio";return"15line";}
function getAllQuranBookmarks(){try{return JSON.parse(localStorage.getItem("quranBookmarks")||"[]");}catch(error){return[];}}
function getSurahStartPageForSelectedQuran(surahNumber){if(selectedQuranType==="15line")return surahTo15LinePageMap[surahNumber]||1;if(selectedQuranType==="16line")return surahTo16LinePageMap[surahNumber]||1;if(selectedQuranType==="9line")return surahNumber;if(selectedQuranType==="audio")return surahNumber;return surahTo15LinePageMap[surahNumber]||1;}
function getJuzStartPageForSelectedQuran(juzNumber){if(selectedQuranType==="15line")return get15LineJuzStartPage(juzNumber);if(selectedQuranType==="16line")return Math.max(1,Math.round(((juzNumber-1)*549/30)+1));if(selectedQuranType==="9line")return juzNumber;if(selectedQuranType==="audio")return juzNumber;return get15LineJuzStartPage(juzNumber);}
function get15LineJuzStartPage(juzNumber){let runningTotal=0;for(let i=1;i<juzNumber;i++){runningTotal+=juzPageCounts[i];}return runningTotal+1;}
function openSelectedQuranOption(option){if(option==="bookmark"){openSelectedQuranBookmarks();return;}if(option==="resume"){resumeSelectedQuran();return;}if(option==="goto"){goToSelectedQuranPage();return;}}
function openSelectedQuranBookmarks(){let allBookmarks=getAllQuranBookmarks();let bookmarkType=getBookmarkTypeForSelectedQuran();let found=allBookmarks.find(function(item){return item.type===bookmarkType;});if(found&&found.page){openSelectedQuranAtPage(Number(found.page),null);return;}showToast("No bookmark found for "+getSelectedQuranLabel());}
function resumeSelectedQuran(){let page=1;if(selectedQuranType==="15line"){page=parseInt(localStorage.getItem("lastMushafPage")||"1",10);}else if(selectedQuranType==="16line"){page=parseInt(localStorage.getItem("lastQuran16Page")||localStorage.getItem("quran16LastPage")||"1",10);}else if(selectedQuranType==="9line"){page=parseInt(localStorage.getItem("lastQuran9Page")||"1",10);}else if(selectedQuranType==="audio"){page=parseInt(localStorage.getItem("lastArabicQuranSurah")||"1",10);}openSelectedQuranAtPage(page,null);}
function goToSelectedQuranPage(){let maxPage=getSelectedQuranMaxPage();let pageText=prompt("Enter page number 1 to "+maxPage);if(pageText===null)return;let page=parseInt(pageText,10);if(!page||page<1||page>maxPage){showToast("Please enter page number 1 to "+maxPage);return;}openSelectedQuranAtPage(page,null);}
function getSelectedQuranMaxPage(){if(selectedQuranType==="15line")return 847;if(selectedQuranType==="16line")return 549;if(selectedQuranType==="9line")return 30;if(selectedQuranType==="audio")return 114;return 847;}
function openSelectedQuranAtPage(page,surahNumber){localStorage.setItem("ibadahFolderReturnPage","quran");localStorage.setItem("ibadahQuranBackPage",getQuranReturnPage());if(selectedQuranType==="15line"){localStorage.setItem("openQuran15PageNumber",String(page||1));window.location.href="../QuranPages/?from=quran&page="+encodeURIComponent(page||1);return;}if(selectedQuranType==="16line"){localStorage.setItem("openQuran16PageNumber",String(page||1));window.location.href="../16linequranpages/?from=quran&page="+encodeURIComponent(page||1);return;}if(selectedQuranType==="9line"){localStorage.setItem("openQuran9PageNumber",String(page||1));window.location.href="../9LineQuran/?from=quran&page="+encodeURIComponent(page||1);return;}if(selectedQuranType==="audio"){localStorage.setItem("openArabicQuranSurahNumber",String(surahNumber||page||1));window.location.href="../arabic-quran/?from=quran&surah="+encodeURIComponent(surahNumber||page||1);return;}}
function goBackFromQuranPage(){let returnPage=getQuranReturnPage();if(returnPage==="more"){window.location.href="../more/";return;}if(returnPage==="tracker"){window.location.href="../tracker/";return;}if(returnPage==="salah"){window.location.href="../salah/";return;}window.location.href="../home/";}
function getQuranReturnPage(){let params=new URLSearchParams(window.location.search);return params.get("from")||localStorage.getItem("ibadahQuranBackPage")||"home";}
function openArabicQuranPage(){selectedQuranType="audio";openSelectedQuranAtPage(1,1);}
function open9LineQuranPage(){selectedQuranType="9line";openSelectedQuranAtPage(1,null);}
function openQuran15Page(){selectedQuranType="15line";openSelectedQuranAtPage(1,null);}
function openQuran16Page(){selectedQuranType="16line";openSelectedQuranAtPage(1,null);}
function getQuran16ImagePath(page){return "../16linequranpages/"+page+".jpg";}
function getRealJuzInfoFromMushafPage(page){let runningTotal=0;for(let juzNumber=1;juzNumber<=30;juzNumber++){let juzCount=juzPageCounts[juzNumber];let juzStart=runningTotal+1;let juzEnd=runningTotal+juzCount;if(page>=juzStart&&page<=juzEnd){return{juzNumber:juzNumber,pageInsideJuz:page-runningTotal,juzStart:juzStart,juzEnd:juzEnd};}runningTotal+=juzCount;}return{juzNumber:1,pageInsideJuz:1,juzStart:1,juzEnd:27};}
function buildMushafImagePath(page){let info=getRealJuzInfoFromMushafPage(page);let paddedPage=String(info.pageInsideJuz).padStart(2,"0");return "../QuranPages/juz"+info.juzNumber+"/"+info.juzNumber+"-"+paddedPage+".png";}
async function downloadQuran16Full(){let btn=document.getElementById("quran16DownloadBtn");if(!btn)return;btn.disabled=true;btn.innerText="Downloading...";btn.style.opacity="0.7";try{const cache=await caches.open("ibadah-runtime-v1");for(let page=1;page<=549;page++){let url=getQuran16ImagePath(page);try{let response=await fetch(url,{cache:"no-store"});if(response.ok){await cache.put(url,response.clone());}}catch(error){console.log("16 line skip page:",page,error);}if(page%20===0){btn.innerText="Downloading "+page+" / 549";}}localStorage.setItem("quran16FullDownloaded","yes");btn.innerText="16 Line Downloaded";btn.style.opacity="1";btn.style.background="#dff6e4";btn.style.color="#177245";showToast("16 Line Quran downloaded");}catch(error){console.log("16 line full download failed:",error);btn.disabled=false;btn.innerText="16 Line Quran";btn.style.opacity="1";showToast("16 Line download failed");}}
async function downloadQuran15Full(){let btn=document.getElementById("quran15DownloadBtn");if(!btn)return;btn.disabled=true;btn.innerText="Downloading...";btn.style.opacity="0.7";try{const cache=await caches.open("ibadah-runtime-v1");for(let page=1;page<=847;page++){let url=buildMushafImagePath(page);try{let response=await fetch(url,{cache:"no-store"});if(response.ok){await cache.put(url,response.clone());}}catch(error){console.log("15 line skip page:",page,error);}if(page%20===0){btn.innerText="Downloading "+page+" / 847";}}localStorage.setItem("quran15FullDownloaded","yes");btn.innerText="15 Line Downloaded";btn.style.opacity="1";btn.style.background="#dff6e4";btn.style.color="#177245";showToast("15 Line Quran downloaded");}catch(error){console.log("15 line full download failed:",error);btn.disabled=false;btn.innerText="15 Line Quran";btn.style.opacity="1";showToast("15 Line download failed");}}
function updateFullQuranDownloadButtonsUI(){let btn15=document.getElementById("quran15DownloadBtn");let btn16=document.getElementById("quran16DownloadBtn");if(btn15&&localStorage.getItem("quran15FullDownloaded")==="yes"){btn15.innerText="15 Line Downloaded";btn15.style.background="#dff6e4";btn15.style.color="#177245";btn15.style.opacity="1";}if(btn16&&localStorage.getItem("quran16FullDownloaded")==="yes"){btn16.innerText="16 Line Downloaded";btn16.style.background="#dff6e4";btn16.style.color="#177245";btn16.style.opacity="1";}}
async function resetOfflineDownloads(){let confirmDelete=confirm("Remove all downloaded Quran files?");if(!confirmDelete)return;try{if("caches" in window){let cacheNames=await caches.keys();for(let cacheName of cacheNames){if(cacheName==="ibadah-runtime-v1"){await caches.delete(cacheName);}}}localStorage.removeItem("juz30OfflineDownloaded");localStorage.removeItem("quran16FullDownloaded");localStorage.removeItem("quran15FullDownloaded");updateFullQuranDownloadButtonsUI();showToast("Offline Quran downloads removed");}catch(error){console.log("Reset failed:",error);showToast("Failed to remove downloads");}}
function showToast(message){let toast=document.getElementById("toast");if(!toast)return;toast.innerText=message;toast.style.display="block";clearTimeout(window.quranToastTimer);window.quranToastTimer=setTimeout(function(){toast.style.display="none";},1900);}
document.addEventListener("DOMContentLoaded",function(){updateQuranTypeButtons();renderCurrentQuranList();updateFullQuranDownloadButtonsUI();});
