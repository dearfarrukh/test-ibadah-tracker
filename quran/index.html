*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;background:#eaf6ff;color:#0b2450;overflow:hidden;}
body{position:fixed;inset:0;}
.quranApp{width:100%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(circle at 12% 5%,rgba(255,255,255,.95),transparent 24%),linear-gradient(180deg,#dff4ff 0%,#eef9ff 45%,#f9fcff 100%);padding-bottom:118px;}

.quranBackBtn,.quranSearchBtn{position:absolute;width:44px;height:44px;border:none;border-radius:50%;background:white;color:#0a4b95;font-size:23px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(16,98,176,.18);cursor:pointer;}
.quranBackBtn{left:4%;}.quranSearchBtn{right:4%;}

.quranTopTitle{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:1000;letter-spacing:-.5px;color:#08275b;}
.quranLogoCircle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0059d8,#02b8ff);color:white;font-size:18px;box-shadow:0 8px 20px rgba(0,101,210,.22);}
.quranContent{padding:14px 4% 0;}
.quranHeroCard{position:relative;overflow:hidden;min-height:148px;border-radius:34px;padding:22px 5%;background:radial-gradient(circle at 82% 28%,rgba(96,207,255,.56),transparent 28%),linear-gradient(135deg,#062b80 0%,#075bd9 52%,#18b9ff 100%);color:white;box-shadow:0 18px 42px rgba(0,87,202,.26);border:1px solid rgba(255,255,255,.42);margin-bottom:12px;}

.quranHeroCard:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-56px;top:-70px;background:rgba(255,255,255,.14);box-shadow:-42px 82px 0 rgba(255,255,255,.08),-112px 118px 0 rgba(255,255,255,.06);}
.quranHeroInside{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;min-height:104px;text-align:center;}
.quranHeroCenter{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;}
.quranKareemArabic{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;font-size:46px;font-weight:700;line-height:1.2;margin:0;text-align:center;width:100%;text-shadow:0 4px 18px rgba(0,0,0,.16);}

.quranBookArt{width:94px;height:94px;border-radius:30px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-size:48px;flex-shrink:0;}
.quranTypeWrap{margin-bottom:10px;}
.quranTypeSelector{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:rgba(255,255,255,.64);border:1px solid rgba(20,122,210,.12);padding:6px;border-radius:22px;box-shadow:0 9px 24px rgba(27,129,205,.11);}
.quranTypeBtn{border:none;border-radius:17px;padding:10px 2px;background:transparent;color:#275a83;font-size:12.5px;font-weight:950;cursor:pointer;white-space:nowrap;}
.quranTypeBtn.active{background:linear-gradient(135deg,#005ee8,#08b6ff);color:white;box-shadow:0 7px 16px rgba(0,101,220,.22);}
.quranTopToolCard{background:rgba(255,255,255,.88);border-radius:28px;border:1px solid rgba(28,126,205,.12);box-shadow:0 12px 28px rgba(28,126,205,.13);padding:10px;margin-bottom:0;}
.quranToolRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.quranToolRowFour{grid-template-columns:repeat(4,1fr);}
.quranToolBtn{height:48px;border:none;border-radius:18px;background:#f1f9ff;color:#08396f;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:950;cursor:pointer;white-space:nowrap;}
.quranToolIcon{font-size:18px;}

.quranSectionTitle{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;color:#08275b;}
.quranSectionTitle strong{font-size:20px;font-weight:1000;letter-spacing:-.4px;}
.quranSectionTitle span{font-size:13px;font-weight:900;color:#1b8ed7;}
.quranList{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;}
.quranListCard{width:100%;min-height:82px;border:none;border-radius:26px;background:rgba(255,255,255,.94);box-shadow:0 8px 22px rgba(39,135,205,.11);border:1px solid rgba(21,120,200,.10);padding:13px 4%;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;}
.quranListBadge{width:48px;height:48px;border-radius:18px;background:linear-gradient(135deg,#dff5ff,#bdeaff);color:#086bbe;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:1000;flex-shrink:0;}
.quranListInfo{flex:1;min-width:0;}.quranListTitle{font-size:18px;font-weight:1000;color:#102b52;margin-bottom:3px;letter-spacing:-.25px;}.quranListSub{font-size:13px;font-weight:850;color:#617d94;line-height:1.35;}
.quranListArabic{font-family:"Amiri","Noto Naskh Arabic",serif;direction:rtl;font-size:30px;color:#168b72;line-height:1;flex-shrink:0;}.quranChevron{font-size:26px;color:#8aa9c1;font-weight:900;}
.downloadArea{display:none;padding-bottom:22px;}.downloadCard{width:100%;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;padding:20px 5%;box-shadow:0 10px 26px rgba(39,135,205,.11);border:1px solid rgba(21,120,200,.10);}
.downloadTitle{font-size:22px;font-weight:950;color:#102b52;letter-spacing:-.4px;margin-bottom:6px;}.downloadSub{font-size:14px;color:#617d94;line-height:1.45;font-weight:750;margin-bottom:14px;}
.downloadGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.downloadBtn{border:none;border-radius:20px;padding:15px 10px;background:#f1f9ff;color:#08396f;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 6px 16px rgba(39,135,205,.10);}.downloadBtn:disabled{opacity:.65;}
.resetBtn{width:100%;margin-top:10px;border:none;border-radius:20px;padding:15px;background:#fff1f1;color:#d11a2a;font-size:16px;font-weight:950;cursor:pointer;}
#toast{display:none;position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(17,17,17,.92);color:white;border-radius:18px;padding:13px 16px;font-size:15px;font-weight:850;z-index:10000;max-width:88%;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.20);}

.quranSearchPanel{display:none;margin:0 0 10px 0;animation:quranSearchDrop .18s ease forwards;}
.quranSearchPanel.show{display:block;}
@keyframes quranSearchDrop{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.quranSearchInput{width:100%;height:52px;border:none;outline:none;border-radius:22px;background:white;color:#08275b;padding:0 16px;font-size:16px;font-weight:850;box-shadow:0 8px 20px rgba(39,135,205,.12);border:1px solid rgba(21,120,200,.10);}
.quranSearchInput::placeholder{color:#7b97ad;}
.quranToolBtn.disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.25);}

.quranNoResultCard{width:100%;background:rgba(255,255,255,.94);border-radius:26px;box-shadow:0 8px 22px rgba(39,135,205,.11);border:1px solid rgba(21,120,200,.10);padding:24px 5%;text-align:center;}

<div class="quranApp">
  <div class="quranTopBar">
    <button class="quranBackBtn" onclick="goBackFromQuranPage()">←</button>

  </div>

  <div class="quranContent">
    <div class="quranHeroCard">
      <div class="quranHeroInside">

        </div>
      </div>
    </div>

    <div class="quranTypeWrap">
      <div class="quranTypeSelector">
        <button id="quranType9" class="quranTypeBtn" onclick="selectQuranType('9line')">9 Line</button>
        <button id="quranType15" class="quranTypeBtn active" onclick="selectQuranType('15line')">15 Line</button>
        <button id="quranType16" class="quranTypeBtn" onclick="selectQuranType('16line')">16 Line</button>
        <button id="quranTypeAudio" class="quranTypeBtn" onclick="selectQuranType('audio')">Audio</button>
      </div>
    </div>

    <div class="quranTopToolCard">
      <div class="quranToolRow quranToolRowFour">
        <button class="quranToolBtn" onclick="openSelectedQuranOption('bookmark')"><span class="quranToolIcon">🔖</span><span>Bookmark</span></button>
        <button class="quranToolBtn" onclick="openSelectedQuranOption('resume')"><span class="quranToolIcon">▶</span><span>Resume</span></button>
        <button class="quranToolBtn" onclick="openSelectedQuranOption('goto')"><span class="quranToolIcon">#</span><span>Go To</span></button>
        <button class="quranToolBtn" onclick="toggleQuranSearch()"><span class="quranToolIcon">⌕</span><span>Search</span></button>
      </div>
    </div>

    <div class="quranStickyTools">
      <div class="quranToolRow">
        <button id="toolJuzBtn" class="quranToolBtn" onclick="showQuranListMode('juz')"><span class="quranToolIcon">30</span><span>Juz</span></button>
        <button id="toolSurahBtn" class="quranToolBtn active" onclick="showQuranListMode('surah')"><span class="quranToolIcon">☰</span><span>Surah</span></button>
        <button id="toolFavoriteBtn" class="quranToolBtn" onclick="showQuranListMode('favorite')"><span class="quranToolIcon">★</span><span>Favorite</span></button>
      </div>
    </div>

    <div id="quranSearchPanel" class="quranSearchPanel">
      <input id="quranSearchInput" class="quranSearchInput" type="search" placeholder="Search Surah..." oninput="renderCurrentQuranList()">
    </div>

    <div class="quranSectionTitle"><strong id="quranListTitle">Surah List</strong><span id="selectedQuranTypeText">15 Line Quran</span></div>
    <div id="quranList" class="quranList"></div>

    <div id="downloadArea" class="downloadArea">
      <div class="downloadCard">
        <div class="downloadTitle">Offline Quran Downloads</div>
        <div class="downloadSub">Download Quran pages for offline reading. Your saved app data will stay safe.</div>
        <div class="downloadGrid">

          <button id="quran16DownloadBtn" class="downloadBtn" onclick="downloadQuran16Full()">16 Line Quran</button>
        </div>
        <button class="resetBtn" onclick="resetOfflineDownloads()">Remove Offline Downloads</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

/* =========================

function renderSurahList(){

  let container=document.getElementById("quranList");
  if(!container)return;

  let query=getQuranSearchQuery();
  container.innerHTML="";

  surahData.forEach(function(surah){

    let searchText=(surah.num+" "+surah.en+" "+surah.ar+" "+surah.verses).toLowerCase();

    if(query&&!searchText.includes(query)){
      return;
    }

    let page=getSurahStartPageForSelectedQuran(surah.num);
    let displayPage=page;

    if(selectedQuranType==="16line"){
      displayPage=page+1;
    }

    let card=document.createElement("button");
    card.className="quranListCard";

    card.onclick=function(){

      if(selectedQuranType==="audio"){

        localStorage.setItem("selectedQuranType","audio");
        localStorage.setItem("openArabicQuranSurahNumber",String(surah.num));
        localStorage.setItem("openArabicQuranDirectFromQuranIndex","yes");

        window.location.href="../arabic-quran/?from=quran&surah="+encodeURIComponent(surah.num);
        return;

      }

      openSelectedQuranAtPage(page,surah.num);

    };

    let subText="Page "+displayPage+" • "+surah.verses+" verses";

    if(selectedQuranType==="audio"){
      subText=surah.verses+" verses • Audio Quran";
    }

    card.innerHTML=`<div class="quranListBadge">${surah.num}</div><div class="quranListInfo"><div class="quranListTitle">${surah.en}</div><div class="quranListSub">${subText}</div></div><div class="quranListArabic">${surah.ar}</div><div class="quranChevron">›</div>`;

    container.appendChild(card);

  });

  if(!container.innerHTML){
    container.innerHTML=`<div class="quranNoResultCard"><div class="quranNoResultTitle">No Surah found</div><div class="quranNoResultSub">Try another Surah name or number.</div></div>`;
  }

}

========================= */
function renderBookmarkList(){

  let container=document.getElementById("quranList");
  if(!container)return;

  let allBookmarks=getAllQuranBookmarks();
  let savedItems=filterQuranSavedItemsForSelectedType(allBookmarks);

  container.innerHTML="";

  if(!savedItems.length){
    container.innerHTML=`<div class="quranNoResultCard"><div class="quranNoResultTitle">No bookmarks yet</div><div class="quranNoResultSub">Open a Quran reader and save a bookmark. Then it will show here for ${getSelectedQuranLabel()}.</div></div>`;
    return;
  }

  savedItems.forEach(function(saved){

    let bookmark=saved.item;
    let originalIndex=saved.index;
    let page=getSavedQuranItemPage(bookmark);
    let title=getSavedQuranItemTitle(bookmark,"Bookmark");
    let subText=getSavedQuranItemSubText(bookmark,page);

    let card=document.createElement("button");
    card.className="quranListCard";

    card.onclick=function(){
      openSelectedQuranAtPage(page,null);
    };

    card.innerHTML=`<div class="quranListBadge">🔖</div><div class="quranListInfo"><div class="quranListTitle">${title}</div><div class="quranListSub">${subText}</div><div class="quranSavedHint">Tap card to open</div></div><button class="quranSavedDeleteBtn" type="button" aria-label="Delete bookmark">🗑️</button>`;

    let deleteBtn=card.querySelector(".quranSavedDeleteBtn");
    if(deleteBtn){
      deleteBtn.onclick=function(event){
        event.stopPropagation();
        deleteQuranBookmark(originalIndex);
      };
    }

    container.appendChild(card);

  });

}

/* =========================
   FILTER QURAN SAVED ITEMS FOR SELECTED TYPE
   Full function name: filterQuranSavedItemsForSelectedType()
========================= */
function filterQuranSavedItemsForSelectedType(items){

  let selectedType=getBookmarkTypeForSelectedQuran();

  return items
    .map(function(item,index){
      return{
        item:item,
        index:index
      };
    })
    .filter(function(saved){
      return String(saved.item.type||"")===selectedType;
    });

}

function openSelectedQuranAtPage(page,surahNumber){

  localStorage.setItem("ibadahFolderReturnPage","quran");
  localStorage.setItem("ibadahQuranBackPage",getQuranReturnPage());

  if(selectedQuranType==="15line"){
    localStorage.setItem("openQuran15PageNumber",String(page||1));
    window.location.href="../QuranPages/?from=quran&page="+encodeURIComponent(page||1);
    return;
  }

  if(selectedQuranType==="16line"){
    localStorage.setItem("openQuran16PageNumber",String(page||1));
    window.location.href="../16linequranpages/?from=quran&page="+encodeURIComponent(page||1);
    return;
  }

  if(selectedQuranType==="9line"){

    localStorage.setItem("selectedQuranType","9line");
    localStorage.setItem("openQuran9PageNumber",String(page||1));
    localStorage.setItem("openQuran9DirectFromQuranIndex","yes");

    window.location.href="../9LineQuran/?from=quran&page="+encodeURIComponent(page||1);
    return;

  }

   if(selectedQuranType==="audio"){

    localStorage.setItem("selectedQuranType","audio");
    localStorage.setItem("openArabicQuranSurahNumber",String(surahNumber||page||1));
    localStorage.setItem("openArabicQuranDirectFromQuranIndex","yes");

    window.location.href="../arabic-quran/?from=quran&surah="+encodeURIComponent(surahNumber||page||1);
    return;

  }

}
     
function goBackFromQuranPage(){let returnPage=getQuranReturnPage();if(returnPage==="more"){window.location.href="../more/";return;}if(returnPage==="tracker"){window.location.href="../tracker/";return;}if(returnPage==="salah"){window.location.href="../salah/";return;}window.location.href="../home/";}
function getQuranReturnPage(){let params=new URLSearchParams(window.location.search);return params.get("from")||localStorage.getItem("ibadahQuranBackPage")||"home";}
function openArabicQuranPage(){selectedQuranType="audio";openSelectedQuranAtPage(1,1);}
function open9LineQuranPage(){selectedQuranType="9line";openSelectedQuranAtPage(1,null);}
function openQuran15Page(){selectedQuranType="15line";openSelectedQuranAtPage(1,null);}
function openQuran16Page(){selectedQuranType="16line";openSelectedQuranAtPage(1,null);}
function getQuran16ImagePath(page){return "../16linequranpages/"+page+".jpg";}
function getRealJuzInfoFromMushafPage(page){let runningTotal=0;for(let juzNumber=1;juzNumber<=30;juzNumber++){let juzCount=juzPageCounts[juzNumber];let juzStart=runningTotal+1;let juzEnd=runningTotal+juzCount;if(page>=juzStart&&page<=juzEnd){return{juzNumber:juzNumber,pageInsideJuz:page-runningTotal,juzStart:juzStart,juzEnd:juzEnd};}runningTotal+=juzCount;}return{juzNumber:1,pageInsideJuz:1,juzStart:1,juzEnd:27};}
function buildMushafImagePath(page){let info=getRealJuzInfoFromMushafPage(page);let paddedPage=String(info.pageInsideJuz).padStart(2,"0");return "../QuranPages/juz"+info.juzNumber+"/"+info.juzNumber+"-"+paddedPage+".png";}
async function downloadQuran16Full(){let btn=document.getElementById("quran16DownloadBtn");if(!btn)return;btn.disabled=true;btn.innerText="Downloading...";btn.style.opacity="0.7";try{const cache=await caches.open("ibadah-runtime-v1");for(let page=1;page<=549;page++){let url=getQuran16ImagePath(page);try{let response=await fetch(url,{cache:"no-store"});if(response.ok){await cache.put(url,response.clone());}}catch(error){console.log("16 line skip page:",page,error);}if(page%20===0){btn.innerText="Downloading "+page+" / 549";}}localStorage.setItem("quran16FullDownloaded","yes");btn.innerText="16 Line Downloaded";btn.style.opacity="1";btn.style.background="#dff6e4";btn.style.color="#177245";showToast("16 Line Quran downloaded");}catch(error){console.log("16 line full download failed:",error);btn.disabled=false;btn.innerText="16 Line Quran";btn.style.opacity="1";showToast("16 Line download failed");}}
async function downloadQuran15Full(){let btn=document.getElementById("quran15DownloadBtn");if(!btn)return;btn.disabled=true;btn.innerText="Downloading...";btn.style.opacity="0.7";try{const cache=await caches.open("ibadah-runtime-v1");for(let page=1;page<=847;page++){let url=buildMushafImagePath(page);try{let response=await fetch(url,{cache:"no-store"});if(response.ok){await cache.put(url,response.clone());}}catch(error){console.log("15 line skip page:",page,error);}if(page%20===0){btn.innerText="Downloading "+page+" / 847";}}localStorage.setItem("quran15FullDownloaded","yes");btn.innerText="15 Line Downloaded";btn.style.opacity="1";btn.style.background="#dff6e4";btn.style.color="#177245";showToast("15 Line Quran downloaded");}catch(error){console.log("15 line full download failed:",error);btn.disabled=false;btn.innerText="15 Line Quran";btn.style.opacity="1";showToast("15 Line download failed");}}
function updateFullQuranDownloadButtonsUI(){let btn15=document.getElementById("quran15DownloadBtn");let btn16=document.getElementById("quran16DownloadBtn");if(btn15&&localStorage.getItem("quran15FullDownloaded")==="yes"){btn15.innerText="15 Line Downloaded";btn15.style.background="#dff6e4";btn15.style.color="#177245";btn15.style.opacity="1";}if(btn16&&localStorage.getItem("quran16FullDownloaded")==="yes"){btn16.innerText="16 Line Downloaded";btn16.style.background="#dff6e4";btn16.style.color="#177245";btn16.style.opacity="1";}}
async function resetOfflineDownloads(){let confirmDelete=confirm("Remove all downloaded Quran files?");if(!confirmDelete)return;try{if("caches" in window){let cacheNames=await caches.keys();for(let cacheName of cacheNames){if(cacheName==="ibadah-runtime-v1"){await caches.delete(cacheName);}}}localStorage.removeItem("juz30OfflineDownloaded");localStorage.removeItem("quran16FullDownloaded");localStorage.removeItem("quran15FullDownloaded");updateFullQuranDownloadButtonsUI();showToast("Offline Quran downloads removed");}catch(error){console.log("Reset failed:",error);showToast("Failed to remove downloads");}}
function getQuranSearchQuery(){let input=document.getElementById("quranSearchInput");return input?input.value.trim().toLowerCase():"";}
function toggleQuranSearch(){let panel=document.getElementById("quranSearchPanel");let input=document.getElementById("quranSearchInput");if(!panel||!input)return;quranSearchOpen=!quranSearchOpen;if(quranSearchOpen){panel.classList.add("show");setTimeout(function(){input.focus();},80);}else{panel.classList.remove("show");input.value="";renderCurrentQuranList();}}
function showToast(message){let toast=document.getElementById("toast");if(!toast)return;toast.innerText=message;toast.style.display="block";clearTimeout(window.quranToastTimer);window.quranToastTimer=setTimeout(function(){toast.style.display="none";},1900);}
document.addEventListener("DOMContentLoaded",function(){if(selectedQuranType==="audio"&&selectedListMode==="juz"){selectedListMode="surah";localStorage.setItem("selectedQuranListMode",selectedListMode);}updateQuranTypeButtons();renderCurrentQuranList();updateFullQuranDownloadButtonsUI();});
</script>
