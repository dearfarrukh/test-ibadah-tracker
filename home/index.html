<script>
// =========================
// HOME MENU HANDLE FUNCTIONS
// Full function names:
// toggleHomeSideMenu()
// openHomeSideMenu()
// closeHomeSideMenu()
// =========================
let homeSideMenuOpen = false;

function openHomeSideMenu(){
  let overlay = document.getElementById("homeMenuOverlay");
  let menu = document.getElementById("homeSideMenu");

  if(overlay) overlay.style.display = "block";
  if(menu) menu.style.left = "0";

  homeSideMenuOpen = true;
}

function closeHomeSideMenu(){
  let overlay = document.getElementById("homeMenuOverlay");
  let menu = document.getElementById("homeSideMenu");

  if(overlay) overlay.style.display = "none";
  if(menu) menu.style.left = "-280px";

  homeSideMenuOpen = false;
}

function toggleHomeSideMenu(){
  if(homeSideMenuOpen){
    closeHomeSideMenu();
  }else{
    openHomeSideMenu();
  }
}

// =========================
// HOME MENU ACTIONS
// Full function names:
// goHomeMainPage()
// refreshHomeApp()
// openHomeAppSettings()
// goHomeMorePage()

// =========================
// UPDATE HOME PAGE SALAH SUMMARY
// Full function name: updateHomePageSalahSummary()
// =========================
async function updateHomePageSalahSummary(){

  let locationEl = document.getElementById("homeLocationName");
  let islamicEl = document.getElementById("homeIslamicDate");
  let normalEl = document.getElementById("homeNormalDate");
  let nextNameEl = document.getElementById("homeNextSalahName");
  let nextTimeEl = document.getElementById("homeNextSalahTime");
  let countdownEl = document.getElementById("homeCountdown");

  if(!locationEl || !islamicEl || !normalEl || !nextNameEl || !nextTimeEl || !countdownEl) return;

  let now = new Date();

  normalEl.innerText = now.toLocaleDateString("en-US", {
    weekday:"long",
    month:"short",
    day:"numeric",
    year:"numeric"
  });

  islamicEl.innerText = new Intl.DateTimeFormat("en-TN-u-ca-islamic", {
    day:"numeric",
    month:"long",
    year:"numeric"
  }).format(now);

  locationEl.innerText = "Loading...";
  nextNameEl.innerText = "Next Salah";
  nextTimeEl.innerText = "--:--";
  countdownEl.innerText = "00:00:00";

  try{
    let loc = await loadHomeLocationData();
    locationEl.innerText = loc.city || "My Location";

    let liveData = await loadHomeSalahTimes(now, loc.latitude, loc.longitude);

    let salahList = [
      {name:"Fajr", time: liveData.fajr},
      {name:"Dhuhr", time: liveData.dhuhr},
      {name:"Asr", time: liveData.asr},
      {name:"Maghrib", time: liveData.maghrib},
      {name:"Isha", time: liveData.isha}
    ];

    function convertTimeToDate(timeText){
      if(!timeText || timeText === "--:--") return null;

      let parts = String(timeText).trim().split(" ");
      if(parts.length < 2) return null;

      let hm = parts[0].split(":");
      if(hm.length < 2) return null;

      let hour = parseInt(hm[0], 10);
      let minute = parseInt(hm[1], 10);
      let ampm = parts[1].toUpperCase();

      if(ampm === "PM" && hour !== 12) hour += 12;
      if(ampm === "AM" && hour === 12) hour = 0;

      let d = new Date();
      d.setHours(hour, minute, 0, 0);
      return d;
    }

    let nextSalah = null;

    for(let i = 0; i < salahList.length; i++){
      let salahTime = convertTimeToDate(salahList[i].time);

      if(salahTime && salahTime > now){
        nextSalah = {
          name:salahList[i].name,
          time:salahList[i].time,
          dateObj:salahTime
        };
        break;
      }
    }

    if(!nextSalah){
      let tomorrowFajr = convertTimeToDate(liveData.fajr);

      if(tomorrowFajr){
        tomorrowFajr.setDate(tomorrowFajr.getDate() + 1);
        nextSalah = {
          name:"Fajr",
          time:liveData.fajr,
          dateObj:tomorrowFajr
        };
      }
    }

    if(nextSalah){
      nextNameEl.innerText = nextSalah.name;
      nextTimeEl.innerText = nextSalah.time;

      clearInterval(window.homeCountdownTimer);

      function updateCountdown(){
        let diff = nextSalah.dateObj.getTime() - new Date().getTime();

        if(diff < 0){
          countdownEl.innerText = "00:00:00";
          return;
        }

        let hours = Math.floor(diff / 3600000);
        let minutes = Math.floor((diff % 3600000) / 60000);
        let seconds = Math.floor((diff % 60000) / 1000);

        countdownEl.innerText =
          String(hours).padStart(2,"0") + ":" +
          String(minutes).padStart(2,"0") + ":" +
          String(seconds).padStart(2,"0");
      }

      updateCountdown();
      window.homeCountdownTimer = setInterval(updateCountdown, 1000);
    }
  }catch(error){
    locationEl.innerText = "Location unavailable";
    nextNameEl.innerText = "Next Salah";
    nextTimeEl.innerText = "--:--";
    countdownEl.innerText = "00:00:00";
  }
}

// =========================
// LOAD HOME LOCATION DATA
// Full function name: loadHomeLocationData()
// =========================
function loadHomeLocationData(){

  return new Promise(function(resolve, reject){

    if(!navigator.geolocation){
      reject(new Error("Geolocation unavailable"));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async function(position){

        let lat = position.coords.latitude;
        let lon = position.coords.longitude;
        let city = "My Location";

        try{
          let geoUrl = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon);
          let response = await fetch(geoUrl);
          let data = await response.json();

          if(data && data.address){
            city =
              data.address.city ||
              data.address.town ||
              data.address.village ||
              data.address.hamlet ||
              data.address.county ||
              "My Location";
          }
        }catch(error){
          city = "My Location";
        }

        resolve({
          city:city,
          latitude:lat,
          longitude:lon
        });
      },
      function(){
        reject(new Error("Location blocked"));
      },
      {
        enableHighAccuracy:true,
        timeout:12000,
        maximumAge:300000
      }
    );

  });
}

// =========================
// LOAD HOME SALAH TIMES
// Full function name: loadHomeSalahTimes()
// =========================
async function loadHomeSalahTimes(date, latitude, longitude){

  let day = String(date.getDate()).padStart(2, "0");
  let month = String(date.getMonth() + 1).padStart(2, "0");
  let year = date.getFullYear();

  let url =
    "https://api.aladhan.com/v1/timings/" + day + "-" + month + "-" + year +
    "?latitude=" + encodeURIComponent(latitude) +
    "&longitude=" + encodeURIComponent(longitude) +
    "&method=2";

  let response = await fetch(url);
  let data = await response.json();

  if(!data || !data.data || !data.data.timings){
    throw new Error("Salah times failed");
  }

  let timings = data.data.timings;

  return {
    fajr: to12Hour(cleanTime(timings.Fajr)),
    dhuhr: to12Hour(cleanTime(timings.Dhuhr)),
    asr: to12Hour(cleanTime(timings.Asr)),
    maghrib: to12Hour(cleanTime(timings.Maghrib)),
    isha: to12Hour(cleanTime(timings.Isha))
  };
}

// =========================
// CLEAN TIME
// Full function name: cleanTime()
// =========================
function cleanTime(value){
  return String(value || "").replace(/\s*\(.+?\)\s*/g, "").trim();
}

// =========================
// TO 12 HOUR
// Full function name: to12Hour()
// =========================
function to12Hour(time24){

  let parts = String(time24 || "").split(":");
  if(parts.length < 2) return "--:--";

  let hour = parseInt(parts[0], 10);
  let minute = parts[1];

  let ampm = hour >= 12 ? "PM" : "AM";
  hour = hour % 12;
  if(hour === 0) hour = 12;

  return hour + ":" + minute + " " + ampm;
}

// =========================
// LOAD QURAN AYAT OF THE DAY
// Full function name: loadQuranAyatOfTheDay()
// =========================
async function loadQuranAyatOfTheDay(){

  let arabicBox = document.getElementById("quranAyatArabic");
  let urduBox = document.getElementById("quranAyatUrdu");
  let refBox = document.getElementById("quranAyatReference");
  let statusBox = document.getElementById("quranAyatStatus");

  if(!arabicBox || !urduBox || !refBox || !statusBox) return;

  let today = new Date();
  let start = new Date(today.getFullYear(), 0, 0);
  let diff = today - start;
  let oneDay = 1000 * 60 * 60 * 24;
  let dayNumber = Math.floor(diff / oneDay);
  let ayahNumber = (dayNumber % 6236) + 1;

  let savedAyah = localStorage.getItem("quranAyatOfTheDaySaved");

  try{
    statusBox.innerText = "Online";

    let arabicUrl = "https://api.alquran.cloud/v1/ayah/" + ayahNumber + "/quran-uthmani";
    let urduUrl = "https://api.alquran.cloud/v1/ayah/" + ayahNumber + "/ur.jalandhry";

    let arabicResponse = await fetch(arabicUrl);
    let urduResponse = await fetch(urduUrl);

    if(!arabicResponse.ok || !urduResponse.ok){
      throw new Error("Ayah loading failed");
    }

    let arabicData = await arabicResponse.json();
    let urduData = await urduResponse.json();

    let arabicAyah = arabicData.data.text;
    let urduAyah = urduData.data.text;
    let surahEnglish = arabicData.data.surah.englishName;
    let surahNumber = arabicData.data.surah.number;
    let ayahInSurah = arabicData.data.numberInSurah;

    arabicBox.innerText = arabicAyah;
    urduBox.innerText = urduAyah;
    refBox.innerText = "Surah " + surahEnglish + " " + surahNumber + ":" + ayahInSurah;

    let ayahToSave = {
      arabic:arabicAyah,
      urdu:urduAyah,
      reference:"Surah " + surahEnglish + " " + surahNumber + ":" + ayahInSurah,
      savedDate:today.toDateString()
    };

    localStorage.setItem("quranAyatOfTheDaySaved", JSON.stringify(ayahToSave));

  }catch(error){

    if(savedAyah){
      let oldAyah = JSON.parse(savedAyah);

      arabicBox.innerText = oldAyah.arabic;
      urduBox.innerText = oldAyah.urdu;
      refBox.innerText = oldAyah.reference;
      statusBox.innerText = "Saved";
    }else{
      arabicBox.innerText = "Connect to internet once to load Quran Ayat of the Day.";
      urduBox.innerText = "Quran Ayat of the Day لوڈ کرنے کے لیے ایک بار انٹرنیٹ سے کنیکٹ کریں۔";
      refBox.innerText = "Offline";
      statusBox.innerText = "Offline";
    }
  }
}

// START HOME PAGE
// =========================
document.addEventListener("DOMContentLoaded", function(){
  updateHomePageSalahSummary();
  loadQuranAyatOfTheDay();
});
</script>
