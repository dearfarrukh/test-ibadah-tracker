<style>
/* =========================
   BASIC RESET
========================= */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
  background:#e9e9ee;
  color:#111;
}

body{
  padding:0 0 14% 0;
  overflow-x:hidden;
}

/* =========================
   MAIN PAGE WRAP
========================= */
.homeWrap{
  width:100%;
  min-height:100vh;
  background:#e9e9ee;
  overflow-x:hidden;
}

/* =========================
   TOP HERO WALLPAPER
========================= */
.homeHero{
  position:relative;
  width:100%;
  height:31vh;
  min-height:245px;
  max-height:315px;
  background:
    linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.24)),
    url("../homewallpaper.jpg") center/cover no-repeat;
  overflow:hidden;
  color:white;
  box-shadow:0 8px 26px rgba(0,0,0,0.10);
}

/* =========================
   LEFT MENU HANDLE
========================= */
#homeMenuHandle{
  position:absolute;
  top:7%;
  left:0;
  width:8.2%;
  min-width:34px;
  max-width:42px;
  height:27%;
  min-height:96px;
  max-height:116px;
  background:rgba(255,255,255,0.74);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-top-right-radius:22px;
  border-bottom-right-radius:22px;
  border:1px solid rgba(255,255,255,0.70);
  box-shadow:0 7px 20px rgba(0,0,0,0.14);
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

#homeMenuHandle span{
  display:block;
  text-align:center;
  color:#3a3a3c;
  font-size:11px;
  font-weight:950;
  letter-spacing:1.8px;
  line-height:1.24;
}

/* =========================
   TOP DATE / LOCATION
========================= */
.homeTopRight{
  position:absolute;
  top:7%;
  right:6%;
  width:58%;
  text-align:right;
  color:white;
  z-index:3;
}

#homeLocationName{
  font-size:19px;
  font-weight:950;
  line-height:1.1;

  white-space:nowrap;

}

#homeIslamicDate{
  margin-top:5px;

  line-height:1.15;
  text-shadow:0 3px 10px rgba(0,0,0,0.22);
}

#homeNormalDate{
  margin-top:3px;
  font-size:15px;
  font-weight:900;
  line-height:1.15;
  text-shadow:0 3px 10px rgba(0,0,0,0.22);
}

/* =========================
   BISMILLAH
========================= */
.homeBismillah{

  top:32%;
  left:50%;
  transform:translateX(-50%);
  width:70%;
  text-align:center;
  font-family:"Amiri","Noto Naskh Arabic",serif;

  font-weight:500;
  color:rgba(255,255,255,0.64);
  text-shadow:0 2px 8px rgba(0,0,0,0.14);
  white-space:nowrap;

}

/* =========================
   SALAH TIME AREA
========================= */
.homeSalahArea{

  left:3.5%;
  right:3.5%;
  bottom:10%;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:end;

  z-index:4;
}

.nextSalahBlock{
  text-align:left;
  min-width:0;
}

#homeNextSalahName{

  font-weight:950;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:white;
  text-shadow:0 3px 9px rgba(0,0,0,0.26);
}

#homeNextSalahTime{
  margin-top:5px;
  font-size:36px;
  font-weight:950;
  line-height:1;
  color:white;
  letter-spacing:-1.2px;
  text-shadow:

    0 -1px 0 rgba(0,0,0,0.65),
    1px 0 0 rgba(0,0,0,0.65),
    -1px 0 0 rgba(0,0,0,0.65),

}

.viewSalahLink{

  font-size:16px;
  font-weight:950;
  color:white;
  text-shadow:0 3px 10px rgba(0,0,0,0.26);

}

.timeLeftBlock{
  text-align:right;
  min-width:0;
}

.timeLeftLabel{
  font-size:17px;

  text-transform:uppercase;

  color:white;

}

#homeCountdown{
  margin-top:4px;

  font-weight:950;
  line-height:1;
  color:white;
  letter-spacing:-0.8px;
  text-shadow:
    0 2px 0 rgba(0,0,0,0.75),
    0 -1px 0 rgba(0,0,0,0.65),
    1px 0 0 rgba(0,0,0,0.65),
    -1px 0 0 rgba(0,0,0,0.65),
    0 6px 14px rgba(0,0,0,0.38);
  white-space:nowrap;
}

.untilText{
  margin-top:9px;
  font-size:16px;
  font-weight:850;
  color:white;
  text-shadow:0 3px 10px rgba(0,0,0,0.22);
}

/* =========================
   CONTENT AREA
========================= */
.homeContent{
  width:100%;
  padding:2.2% 3.6% 7% 3.6%;
}

/* =========================
   TOP SHORTCUTS EXACT STYLE
========================= */
.topShortcutCard{
  width:100%;
  background:transparent;
  padding:0 2%;
  margin-bottom:6%;
}

.topShortcutGrid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12%;
  align-items:start;
  justify-items:center;
}

.topShortcutBtn{
  width:100%;
  border:none;
  background:transparent;
  text-align:center;
  cursor:pointer;
  padding:0;
}

.topShortcutBtn:active{

}

.topShortcutIconBox{

  max-width:92px;
  aspect-ratio:1/1;
  margin:0 auto 6px auto;

  align-items:center;
  justify-content:center;
}

.topShortcutIconBox img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.topShortcutBtn span{
  display:block;
  font-size:17px;
  font-weight:950;
  color:#3c65c8;
  line-height:1.1;
  text-shadow:0 1px 0 rgba(255,255,255,0.75);
}

.shortcutDivider{
  width:92%;
  height:1px;
  background:#cfd2dc;
  margin:3% auto 0 auto;
}

/* =========================
   GOLD PATTERN CARD
========================= */
.goldShortcutCard{
  width:100%;
  border-radius:34px;
  padding:4.3% 4.2%;
  margin-bottom:4.5%;
  background:
    linear-gradient(rgba(255,255,255,0.72), rgba(255,255,255,0.72)),
    repeating-linear-gradient(45deg,

      rgba(205,162,55,0.65) 3px,
      transparent 3px,
      transparent 24px

    repeating-linear-gradient(-45deg,
      rgba(205,162,55,0.58) 0px,
      rgba(205,162,55,0.58) 3px,
      transparent 3px,
      transparent 24px
    );

  border:1px solid rgba(255,255,255,0.72);
}

.goldGrid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:4%;
}

.goldBtn{

  background:rgba(255,255,255,0.92);
  border-radius:24px;
  min-height:86px;
  padding:12px 5px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.goldBtn:active{
  transform:scale(0.96);

.goldBtn span{

<script>
// =========================
// HOME SIDE MENU FUNCTIONS
// Full function names:
// openHomeSideMenu()
// closeHomeSideMenu()
// toggleHomeSideMenu()
// =========================
let homeSideMenuOpen = false;

function openHomeSideMenu(){
  let overlay = document.getElementById("homeMenuOverlay");
  let menu = document.getElementById("homeSideMenu");

  if(overlay) overlay.style.display = "block";
  if(menu) menu.style.left = "0";

  homeSideMenuOpen = true;
}

function closeHomeSideMenu(){
  let overlay = document.getElementById("homeMenuOverlay");
  let menu = document.getElementById("homeSideMenu");

  if(overlay) overlay.style.display = "none";
  if(menu) menu.style.left = "-280px";

  homeSideMenuOpen = false;
}

function toggleHomeSideMenu(){
  if(homeSideMenuOpen){
    closeHomeSideMenu();
  }else{
    openHomeSideMenu();
  }
}

// =========================
// MENU ACTION FUNCTIONS
// Full function names:
// goHomeMainPage()
// refreshHomeApp()
// openHomeAppSettings()
// goHomeMorePage()
// =========================
function goHomeMainPage(){
  closeHomeSideMenu();
  window.location.href = "../";
}

function refreshHomeApp(){
  closeHomeSideMenu();
  window.location.href = "./?v=" + Date.now();
}

function openHomeAppSettings(){
  closeHomeSideMenu();
  localStorage.setItem("ibadahOpenAppSettings", "yes");
  window.location.href = "../";
}

function goHomeMorePage(){
  closeHomeSideMenu();
  window.location.href = "../more/";
}

// =========================
// SHORTCUT ACTION FUNCTIONS
// =========================
// =========================
// OPEN HOME QURAN
// Full function name: openHomeQuran()
// =========================
function openHomeQuran(){

  window.location.href = "../quran/?from=home";

}
function openHomeAzkar(){
  window.location.href = "../dailyazkar/?from=home&v=" + Date.now();
}

function openHomeQaza(){
  localStorage.setItem("qazaReturnPage", "home");
  window.location.href = "../qazatracker/";
}

function openHomeTasbih(){
  window.location.href = "../tasbih/?from=home";
}

function openHomeQibla(){
  window.location.href = "../qibla/";
}

function openHomeDua(){
  window.location.href = "../duapage/?from=home&v=" + Date.now();
}

function goHomeSalah(){
  window.location.href = "../salah/";
}

function goHomeTracker(){
  window.location.href = "../tracker/";
}

// =========================
// UPDATE HOME PAGE SALAH SUMMARY
// Full function name: updateHomePageSalahSummary()
// =========================
async function updateHomePageSalahSummary(){

  let locationEl = document.getElementById("homeLocationName");
  let islamicEl = document.getElementById("homeIslamicDate");
  let normalEl = document.getElementById("homeNormalDate");
  let nextNameEl = document.getElementById("homeNextSalahName");
  let nextTimeEl = document.getElementById("homeNextSalahTime");
  let countdownEl = document.getElementById("homeCountdown");

  if(!locationEl || !islamicEl || !normalEl || !nextNameEl || !nextTimeEl || !countdownEl) return;

  let now = new Date();

  normalEl.innerText = now.toLocaleDateString("en-US", {
    weekday:"long",
    month:"long",
    day:"numeric",
    year:"numeric"
  });

  islamicEl.innerText = new Intl.DateTimeFormat("en-TN-u-ca-islamic", {
    weekday:"short",
    day:"numeric",
    month:"long",
    year:"numeric"
  }).format(now);

  locationEl.innerText = "Loading...";
  nextNameEl.innerText = "Next";
  nextTimeEl.innerText = "--:--";
  countdownEl.innerText = "00:00:00";

  try{
    let loc = await loadHomeLocationData();
    locationEl.innerText = loc.city || "My Location";

    let liveData = await loadHomeSalahTimes(now, loc.latitude, loc.longitude);

    let salahList = [
      {name:"Fajr", time: liveData.fajr},
      {name:"Dhuhr", time: liveData.dhuhr},
      {name:"Asr", time: liveData.asr},
      {name:"Maghrib", time: liveData.maghrib},
      {name:"Isha", time: liveData.isha}
    ];

    function convertTimeToDate(timeText){
      if(!timeText || timeText === "--:--") return null;

      let parts = String(timeText).trim().split(" ");
      if(parts.length < 2) return null;

      let hm = parts[0].split(":");
      if(hm.length < 2) return null;

      let hour = parseInt(hm[0], 10);
      let minute = parseInt(hm[1], 10);
      let ampm = parts[1].toUpperCase();

      if(ampm === "PM" && hour !== 12) hour += 12;
      if(ampm === "AM" && hour === 12) hour = 0;

      let d = new Date();
      d.setHours(hour, minute, 0, 0);
      return d;
    }

    let nextSalah = null;

    for(let i = 0; i < salahList.length; i++){
      let salahTime = convertTimeToDate(salahList[i].time);

      if(salahTime && salahTime > now){
        nextSalah = {
          name:salahList[i].name,
          time:salahList[i].time,
          dateObj:salahTime
        };
        break;
      }
    }

    if(!nextSalah){
      let tomorrowFajr = convertTimeToDate(liveData.fajr);

      if(tomorrowFajr){
        tomorrowFajr.setDate(tomorrowFajr.getDate() + 1);
        nextSalah = {
          name:"Fajr",
          time:liveData.fajr,
          dateObj:tomorrowFajr
        };
      }
    }

    if(nextSalah){
      nextNameEl.innerText = nextSalah.name.toUpperCase();
      nextTimeEl.innerText = nextSalah.time;

      clearInterval(window.homeCountdownTimer);

      function updateCountdown(){
        let diff = nextSalah.dateObj.getTime() - new Date().getTime();

        if(diff < 0){
          countdownEl.innerText = "00:00:00";
          return;
        }

        let hours = Math.floor(diff / 3600000);
        let minutes = Math.floor((diff % 3600000) / 60000);
        let seconds = Math.floor((diff % 60000) / 1000);

        countdownEl.innerText =
          String(hours).padStart(2,"0") + ":" +
          String(minutes).padStart(2,"0") + ":" +
          String(seconds).padStart(2,"0");
      }

      updateCountdown();
      window.homeCountdownTimer = setInterval(updateCountdown, 1000);
    }
  }catch(error){
    locationEl.innerText = "Village of Mineola";
    nextNameEl.innerText = "ASR";
    nextTimeEl.innerText = "--:--";
    countdownEl.innerText = "00:00:00";
  }
}

// =========================
// LOAD HOME LOCATION DATA
// Full function name: loadHomeLocationData()
// =========================
function loadHomeLocationData(){

  return new Promise(function(resolve, reject){

    if(!navigator.geolocation){
      reject(new Error("Geolocation unavailable"));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      async function(position){

        let lat = position.coords.latitude;
        let lon = position.coords.longitude;
        let city = "My Location";

        try{
          let geoUrl = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon);
          let response = await fetch(geoUrl);
          let data = await response.json();

          if(data && data.address){
            city =
              data.address.city ||
              data.address.town ||
              data.address.village ||
              data.address.hamlet ||
              data.address.county ||
              "My Location";
          }

          if(city === "Mineola"){
            city = "Village of Mineola";
          }
        }catch(error){
          city = "My Location";
        }

        resolve({
          city:city,
          latitude:lat,
          longitude:lon
        });
      },
      function(){
        reject(new Error("Location blocked"));
      },
      {
        enableHighAccuracy:true,
        timeout:12000,
        maximumAge:300000
      }
    );

  });
}

// =========================
// LOAD HOME SALAH TIMES
// Full function name: loadHomeSalahTimes()
// =========================
async function loadHomeSalahTimes(date, latitude, longitude){

  let day = String(date.getDate()).padStart(2, "0");
  let month = String(date.getMonth() + 1).padStart(2, "0");
  let year = date.getFullYear();

  let url =
    "https://api.aladhan.com/v1/timings/" + day + "-" + month + "-" + year +
    "?latitude=" + encodeURIComponent(latitude) +
    "&longitude=" + encodeURIComponent(longitude) +
    "&method=2";

  let response = await fetch(url);
  let data = await response.json();

  if(!data || !data.data || !data.data.timings){
    throw new Error("Salah times failed");
  }

  let timings = data.data.timings;

  return {
    fajr:to12Hour(cleanTime(timings.Fajr)),
    dhuhr:to12Hour(cleanTime(timings.Dhuhr)),
    asr:to12Hour(cleanTime(timings.Asr)),
    maghrib:to12Hour(cleanTime(timings.Maghrib)),
    isha:to12Hour(cleanTime(timings.Isha))
  };
}

// =========================
// CLEAN TIME
// Full function name: cleanTime()
// =========================
function cleanTime(value){
  return String(value || "").replace(/\s*\(.+?\)\s*/g, "").trim();
}

// =========================
// TO 12 HOUR
// Full function name: to12Hour()
// =========================
function to12Hour(time24){

  let parts = String(time24 || "").split(":");
  if(parts.length < 2) return "--:--";

  let hour = parseInt(parts[0], 10);
  let minute = parts[1];

  let ampm = hour >= 12 ? "PM" : "AM";
  hour = hour % 12;
  if(hour === 0) hour = 12;

  return hour + ":" + minute + " " + ampm;
}

// =========================
// LOAD QURAN AYAT OF THE DAY
// Full function name: loadQuranAyatOfTheDay()
// =========================
async function loadQuranAyatOfTheDay(){

  let arabicBox = document.getElementById("quranAyatArabic");
  let urduBox = document.getElementById("quranAyatUrdu");
  let refBox = document.getElementById("quranAyatReference");
  let statusBox = document.getElementById("quranAyatStatus");

  if(!arabicBox || !urduBox || !refBox || !statusBox) return;

  let today = new Date();
  let start = new Date(today.getFullYear(), 0, 0);
  let diff = today - start;
  let oneDay = 1000 * 60 * 60 * 24;
  let dayNumber = Math.floor(diff / oneDay);
  let ayahNumber = (dayNumber % 6236) + 1;

  let savedAyah = localStorage.getItem("quranAyatOfTheDaySaved");

  try{
    statusBox.innerText = "Online";

    let arabicUrl = "https://api.alquran.cloud/v1/ayah/" + ayahNumber + "/quran-uthmani";
    let urduUrl = "https://api.alquran.cloud/v1/ayah/" + ayahNumber + "/ur.jalandhry";

    let arabicResponse = await fetch(arabicUrl);
    let urduResponse = await fetch(urduUrl);

    if(!arabicResponse.ok || !urduResponse.ok){
      throw new Error("Ayah loading failed");
    }

    let arabicData = await arabicResponse.json();
    let urduData = await urduResponse.json();

    let arabicAyah = arabicData.data.text;
    let urduAyah = urduData.data.text;
    let surahEnglish = arabicData.data.surah.englishName;
    let surahNumber = arabicData.data.surah.number;
    let ayahInSurah = arabicData.data.numberInSurah;

    arabicBox.innerText = arabicAyah;
    urduBox.innerText = urduAyah;
    refBox.innerText = "Surah " + surahEnglish + " " + surahNumber + ":" + ayahInSurah;

    let ayahToSave = {
      arabic:arabicAyah,
      urdu:urduAyah,
      reference:"Surah " + surahEnglish + " " + surahNumber + ":" + ayahInSurah,
      savedDate:today.toDateString()
    };

    localStorage.setItem("quranAyatOfTheDaySaved", JSON.stringify(ayahToSave));

  }catch(error){

    if(savedAyah){
      let oldAyah = JSON.parse(savedAyah);

      arabicBox.innerText = oldAyah.arabic || "Saved ayat unavailable.";
      urduBox.innerText = oldAyah.urdu || "";
      refBox.innerText = oldAyah.reference || "Saved";
      statusBox.innerText = "Saved";
    }else{
      arabicBox.innerText = "Connect to internet once to load Quran Ayat of the Day.";
      urduBox.innerText = "Quran Ayat of the Day لوڈ کرنے کے لیے ایک بار انٹرنیٹ سے کنیکٹ کریں۔";
      refBox.innerText = "Offline";
      statusBox.innerText = "Offline";
    }
  }
}

document.addEventListener("DOMContentLoaded", function(){
  updateHomePageSalahSummary();

});
