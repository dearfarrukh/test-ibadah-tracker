<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Noorani Qaida</title>

<!-- =========================
     PDF.JS LIBRARY
========================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* =========================
   NOORANI QAIDA PDF CANVAS READER
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

/* =========================
   FULL SCREEN READER PAGE
========================= */

#qaidaReaderPage{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:100%;
  background:#111;
  overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

#qaidaTopBar{
  position:absolute;
  top:-92px;
  left:0;
  right:0;
  height:92px;
  z-index:30;
  background:rgba(233,233,238,0.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,0,0,0.08);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 5% 14px 5%;
  transition:top 0.28s ease;
}

#qaidaTopBar.show{
  top:0;
}

.qaidaBackBtn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  background:white;
  color:#111;
  font-size:26px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 14px rgba(0,0,0,0.12);
  cursor:pointer;
}

.qaidaTitleWrap{
  flex:1;
  text-align:center;
  padding:0 12px;
  min-width:0;
}

.qaidaTitle{
  font-size:17px;
  font-weight:900;
  color:#111;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.qaidaSubtitle{
  font-size:12px;
  font-weight:700;
  color:#555;
  margin-top:2px;
}

.qaidaPageBadge{
  min-width:78px;
  height:38px;
  border-radius:999px;
  background:white;
  color:#111;
  font-size:13px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 14px rgba(0,0,0,0.10);
}

/* =========================
   CANVAS PAGE AREA
========================= */

#qaidaCanvasShell{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:100%;
  background:#111;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform 0.28s ease, padding-top 0.28s ease;
  transform-origin:center center;
}

#qaidaCanvasShell.shrink{
  padding-top:92px;
  transform:scale(0.94);
}

#qaidaCanvas{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  background:white;
  display:block;
  box-shadow:0 0 22px rgba(0,0,0,0.45);
}

#qaidaLoadingText{
  position:absolute;
  z-index:5;
  color:white;
  font-size:15px;
  font-weight:800;
  background:rgba(0,0,0,0.45);
  padding:12px 18px;
  border-radius:999px;
}

/* =========================
   TAP LAYER
========================= */

#qaidaTapLayer{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  z-index:15;
  background:transparent;
}

/* =========================
   BOTTOM CONTROLS
========================= */

#qaidaBottomControls{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:35;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  padding:0 5%;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.25s ease;
}

#qaidaBottomControls.show{
  opacity:1;
  pointer-events:auto;
}

.qaidaNavBtn{
  width:44%;
  max-width:190px;
  height:52px;
  border:none;
  border-radius:999px;
  background:rgba(233,233,238,0.96);
  color:#111;
  font-size:16px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(0,0,0,0.25);
  cursor:pointer;
}

.qaidaNavBtn:active,
.qaidaBackBtn:active{
  transform:scale(0.96);
}

.qaidaNavBtn:disabled{
  opacity:0.38;
}

/* =========================
   SMALL PHONE FIX
========================= */

@media (max-width:380px){
  #qaidaTopBar{
    height:86px;
    padding:0 4% 12px 4%;
  }

  #qaidaCanvasShell.shrink{
    padding-top:86px;
    transform:scale(0.94);
  }

  .qaidaTitle{
    font-size:15px;
  }

  .qaidaSubtitle{
    font-size:11px;
  }

  .qaidaBackBtn{
    width:40px;
    height:40px;
  }

  .qaidaPageBadge{
    min-width:70px;
    height:36px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- =========================
     NOORANI QAIDA READER PAGE
========================= -->
<div id="qaidaReaderPage">

  <!-- =========================
       TOP BAR
  ========================= -->
  <div id="qaidaTopBar">
    <button class="qaidaBackBtn" onclick="goBackToBooksPage()">‹</button>

    <div class="qaidaTitleWrap">
      <div class="qaidaTitle">Noorani Qaida</div>
      <div class="qaidaSubtitle">Tap screen to show / hide controls</div>
    </div>

    <div class="qaidaPageBadge" id="qaidaPageBadge">1 / 30</div>
  </div>

  <!-- =========================
       CANVAS PAGE AREA
  ========================= -->
  <div id="qaidaCanvasShell">
    <div id="qaidaLoadingText">Loading page...</div>
    <canvas id="qaidaCanvas"></canvas>
  </div>

  <!-- =========================
       TAP LAYER
  ========================= -->
  <div id="qaidaTapLayer" onclick="toggleQaidaTopBar()"></div>

  <!-- =========================
       BOTTOM CONTROLS
  ========================= -->
  <div id="qaidaBottomControls">
    <button class="qaidaNavBtn" id="qaidaPrevBtn" onclick="event.stopPropagation(); previousQaidaPage();">
      ← Previous
    </button>

    <button class="qaidaNavBtn" id="qaidaNextBtn" onclick="event.stopPropagation(); nextQaidaPage();">
      Next →
    </button>
  </div>

</div>

<script>
/* =========================
   NOORANI QAIDA SETTINGS
========================= */

let currentQaidaPage = 1;
const totalQaidaPages = 30;
let qaidaPdfDocument = null;
let qaidaIsRendering = false;

/* =========================
   PDF.JS WORKER SETUP
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* =========================
   FORMAT PAGE FILE NAME
   full function name: formatQaidaPageFileName
========================= */
function formatQaidaPageFileName(pageNumber){

  let paddedNumber = String(pageNumber).padStart(3, "0");
  return "page-" + paddedNumber + ".pdf";

}

/* =========================
   LOAD QAIDA PDF DOCUMENT
   full function name: loadQaidaPdfDocument
========================= */
async function loadQaidaPdfDocument(pageNumber){

  let loadingText = document.getElementById("qaidaLoadingText");
  loadingText.style.display = "block";
  loadingText.innerHTML = "Loading page...";

  let fileName = formatQaidaPageFileName(pageNumber);

  try{

    qaidaPdfDocument = await pdfjsLib.getDocument(fileName).promise;
    await renderQaidaPdfPage();

  }catch(error){

    loadingText.style.display = "block";
    loadingText.innerHTML = "Could not load PDF page";
    console.log("Noorani Qaida PDF load error:", error);

  }

}

/* =========================
   RENDER QAIDA PDF PAGE
   full function name: renderQaidaPdfPage
========================= */
async function renderQaidaPdfPage(){

  if(!qaidaPdfDocument || qaidaIsRendering){
    return;
  }

  qaidaIsRendering = true;

  let loadingText = document.getElementById("qaidaLoadingText");
  let canvas = document.getElementById("qaidaCanvas");
  let context = canvas.getContext("2d");

  loadingText.style.display = "block";
  loadingText.innerHTML = "Loading page...";

  try{

    let page = await qaidaPdfDocument.getPage(1);

    let shell = document.getElementById("qaidaCanvasShell");
    let shellWidth = shell.clientWidth;
    let shellHeight = shell.clientHeight;

    let viewportOriginal = page.getViewport({ scale:1 });

    let widthScale = shellWidth / viewportOriginal.width;
    let heightScale = shellHeight / viewportOriginal.height;

    let finalScale = Math.min(widthScale, heightScale) * 1.02;

    let viewport = page.getViewport({ scale:finalScale });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    canvas.style.width = viewport.width + "px";
    canvas.style.height = viewport.height + "px";

    await page.render({
      canvasContext:context,
      viewport:viewport
    }).promise;

    loadingText.style.display = "none";

  }catch(error){

    loadingText.style.display = "block";
    loadingText.innerHTML = "Could not show page";
    console.log("Noorani Qaida render error:", error);

  }

  qaidaIsRendering = false;

}

/* =========================
   LOAD QAIDA PAGE
   full function name: loadQaidaPage
========================= */
function loadQaidaPage(pageNumber){

  if(pageNumber < 1){
    pageNumber = 1;
  }

  if(pageNumber > totalQaidaPages){
    pageNumber = totalQaidaPages;
  }

  currentQaidaPage = pageNumber;

  let badge = document.getElementById("qaidaPageBadge");
  let prevBtn = document.getElementById("qaidaPrevBtn");
  let nextBtn = document.getElementById("qaidaNextBtn");

  badge.innerHTML = currentQaidaPage + " / " + totalQaidaPages;

  prevBtn.disabled = currentQaidaPage === 1;
  nextBtn.disabled = currentQaidaPage === totalQaidaPages;

  localStorage.setItem("nooraniQaidaLastPage", currentQaidaPage);

  loadQaidaPdfDocument(currentQaidaPage);

}

/* =========================
   NEXT QAIDA PAGE
   full function name: nextQaidaPage
========================= */
function nextQaidaPage(){

  if(currentQaidaPage < totalQaidaPages){
    loadQaidaPage(currentQaidaPage + 1);
  }

}

/* =========================
   PREVIOUS QAIDA PAGE
   full function name: previousQaidaPage
========================= */
function previousQaidaPage(){

  if(currentQaidaPage > 1){
    loadQaidaPage(currentQaidaPage - 1);
  }

}

/* =========================
   TOGGLE TOP BAR
   full function name: toggleQaidaTopBar
========================= */
function toggleQaidaTopBar(){

  let topBar = document.getElementById("qaidaTopBar");
  let canvasShell = document.getElementById("qaidaCanvasShell");
  let bottomControls = document.getElementById("qaidaBottomControls");

  topBar.classList.toggle("show");
  canvasShell.classList.toggle("shrink");
  bottomControls.classList.toggle("show");

  setTimeout(function(){
    renderQaidaPdfPage();
  }, 320);

}

/* =========================
   GO BACK TO BOOKS PAGE
   full function name: goBackToBooksPage
========================= */
function goBackToBooksPage(){

  window.location.href = "../";

}

/* =========================
   KEYBOARD SUPPORT
   full function name: handleQaidaKeyboardControls
========================= */
function handleQaidaKeyboardControls(event){

  if(event.key === "ArrowRight"){
    nextQaidaPage();
  }

  if(event.key === "ArrowLeft"){
    previousQaidaPage();
  }

  if(event.key === "Escape"){
    goBackToBooksPage();
  }

}

/* =========================
   LOAD LAST SAVED PAGE
   full function name: loadLastSavedQaidaPage
========================= */
function loadLastSavedQaidaPage(){

  let savedPage = parseInt(localStorage.getItem("nooraniQaidaLastPage"), 10);

  if(savedPage && savedPage >= 1 && savedPage <= totalQaidaPages){
    loadQaidaPage(savedPage);
  }else{
    loadQaidaPage(1);
  }

}

/* =========================
   HANDLE SCREEN RESIZE
   full function name: handleQaidaScreenResize
========================= */
function handleQaidaScreenResize(){

  setTimeout(function(){
    renderQaidaPdfPage();
  }, 250);

}

/* =========================
   PAGE START
========================= */

document.addEventListener("keydown", handleQaidaKeyboardControls);
window.addEventListener("resize", handleQaidaScreenResize);
window.addEventListener("orientationchange", handleQaidaScreenResize);

loadLastSavedQaidaPage();
</script>

</body>
</html>
