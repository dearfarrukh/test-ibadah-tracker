<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Noorani Qaida</title>

<!-- =========================
     PDF.JS LIBRARY
========================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
/* =========================
   NOORANI QAIDA SLIDING READER
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

/* =========================
   FULL SCREEN PAGE
========================= */

#qaidaReaderPage{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:100%;
  background:#111;
  overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

#qaidaTopBar{
  position:absolute;
  top:-92px;
  left:0;
  right:0;
  height:92px;
  z-index:50;
  background:rgba(233,233,238,0.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(0,0,0,0.08);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 5% 14px 5%;
  transition:top 0.28s ease;
}

#qaidaTopBar.show{
  top:0;
}

.qaidaBackBtn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  background:white;
  color:#111;
  font-size:26px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 14px rgba(0,0,0,0.12);
  cursor:pointer;
}

.qaidaTitleWrap{
  flex:1;
  text-align:center;
  padding:0 12px;
  min-width:0;
}

.qaidaTitle{
  font-size:17px;
  font-weight:900;
  color:#111;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.qaidaSubtitle{
  font-size:12px;
  font-weight:700;
  color:#555;
  margin-top:2px;
}

.qaidaPageBadge{
  min-width:78px;
  height:38px;
  border-radius:999px;
  background:white;
  color:#111;
  font-size:13px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 14px rgba(0,0,0,0.10);
}

/* =========================
   SLIDING READER SHELL
========================= */

#qaidaSlideShell{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:100%;
  background:#111;
  overflow:hidden;
  transition:transform 0.28s ease, padding-top 0.28s ease;
  transform-origin:center center;
}

#qaidaSlideShell.shrink{
  padding-top:92px;
  transform:scale(0.94);
}

/* =========================
   SLIDE TRACK
========================= */

#qaidaSlideTrack{
  position:absolute;
  top:0;
  left:0;
  width:300%;
  height:100%;
  display:flex;
  transform:translateX(-33.3333%);
  will-change:transform;
}

.qaidaSlidePane{
  width:33.3333%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#111;
  padding:0;
}

.qaidaCanvas{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  background:white;
  display:block;
  box-shadow:0 0 22px rgba(0,0,0,0.45);
}

/* =========================
   LOADING TEXT
========================= */

#qaidaLoadingText{
  position:absolute;
  z-index:20;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:15px;
  font-weight:800;
  background:rgba(0,0,0,0.55);
  padding:12px 18px;
  border-radius:999px;
  pointer-events:none;
}

/* =========================
   TOUCH LAYER
========================= */

#qaidaTouchLayer{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  z-index:25;
  background:transparent;
}

/* =========================
   BOTTOM CONTROLS
========================= */

#qaidaBottomControls{
  position:absolute;
  left:0;
  right:0;
  bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:55;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  padding:0 5%;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.25s ease;
}

#qaidaBottomControls.show{
  opacity:1;
  pointer-events:auto;
}

.qaidaNavBtn{
  width:44%;
  max-width:190px;
  height:52px;
  border:none;
  border-radius:999px;
  background:rgba(233,233,238,0.96);
  color:#111;
  font-size:16px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(0,0,0,0.25);
  cursor:pointer;
}

.qaidaNavBtn:active,
.qaidaBackBtn:active{
  transform:scale(0.96);
}

.qaidaNavBtn:disabled{
  opacity:0.38;
}

/* =========================
   SMALL PHONE FIX
========================= */

@media (max-width:380px){
  #qaidaTopBar{
    height:86px;
    padding:0 4% 12px 4%;
  }

  #qaidaSlideShell.shrink{
    padding-top:86px;
    transform:scale(0.94);
  }

  .qaidaTitle{
    font-size:15px;
  }

  .qaidaSubtitle{
    font-size:11px;
  }

  .qaidaBackBtn{
    width:40px;
    height:40px;
  }

  .qaidaPageBadge{
    min-width:70px;
    height:36px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- =========================
     NOORANI QAIDA READER PAGE
========================= -->
<div id="qaidaReaderPage">

  <!-- =========================
       TOP BAR
  ========================= -->
  <div id="qaidaTopBar">
    <button class="qaidaBackBtn" onclick="goBackToBooksPage()">‹</button>

    <div class="qaidaTitleWrap">
      <div class="qaidaTitle">Noorani Qaida</div>
      <div class="qaidaSubtitle">Swipe page or tap screen for controls</div>
    </div>

    <div class="qaidaPageBadge" id="qaidaPageBadge">1 / 30</div>
  </div>

  <!-- =========================
       SLIDING CANVAS READER
  ========================= -->
  <div id="qaidaSlideShell">

    <div id="qaidaSlideTrack">

      <div class="qaidaSlidePane">
        <canvas id="qaidaPrevCanvas" class="qaidaCanvas"></canvas>
      </div>

      <div class="qaidaSlidePane">
        <canvas id="qaidaCurrentCanvas" class="qaidaCanvas"></canvas>
      </div>

      <div class="qaidaSlidePane">
        <canvas id="qaidaNextCanvas" class="qaidaCanvas"></canvas>
      </div>

    </div>

    <div id="qaidaLoadingText">Loading page...</div>

  </div>

  <!-- =========================
       TOUCH LAYER
  ========================= -->
  <div
    id="qaidaTouchLayer"
    ontouchstart="handleQaidaTouchStart(event)"
    ontouchmove="handleQaidaTouchMove(event)"
    ontouchend="handleQaidaTouchEnd(event)"
    onmousedown="handleQaidaMouseStart(event)"
  ></div>

  <!-- =========================
       BOTTOM CONTROLS
  ========================= -->
  <div id="qaidaBottomControls">
    <button class="qaidaNavBtn" id="qaidaPrevBtn" onclick="event.stopPropagation(); previousQaidaPage();">
      ← Previous
    </button>

    <button class="qaidaNavBtn" id="qaidaNextBtn" onclick="event.stopPropagation(); nextQaidaPage();">
      Next →
    </button>
  </div>

</div>

<script>
/* =========================
   NOORANI QAIDA SETTINGS
========================= */

let currentQaidaPage = 1;
const totalQaidaPages = 30;

let qaidaTouchStartX = 0;
let qaidaTouchStartY = 0;
let qaidaTouchCurrentX = 0;
let qaidaTouchCurrentY = 0;
let qaidaIsDragging = false;
let qaidaDidDrag = false;
let qaidaIsAnimating = false;

let qaidaMouseIsDown = false;

const qaidaSwipeTriggerPercent = 0.22;

/* =========================
   PDF.JS WORKER SETUP
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* =========================
   FORMAT PAGE FILE NAME
   full function name: formatQaidaPageFileName
========================= */
function formatQaidaPageFileName(pageNumber){

  let paddedNumber = String(pageNumber).padStart(3, "0");
  return "page-" + paddedNumber + ".pdf";

}

/* =========================
   GET SAFE QAIDA PAGE NUMBER
   full function name: getSafeQaidaPageNumber
========================= */
function getSafeQaidaPageNumber(pageNumber){

  if(pageNumber < 1){
    return 1;
  }

  if(pageNumber > totalQaidaPages){
    return totalQaidaPages;
  }

  return pageNumber;

}

/* =========================
   RENDER PDF PAGE TO CANVAS
   full function name: renderQaidaPdfToCanvas
========================= */
async function renderQaidaPdfToCanvas(pageNumber, canvasId){

  pageNumber = getSafeQaidaPageNumber(pageNumber);

  let canvas = document.getElementById(canvasId);
  let context = canvas.getContext("2d");

  let fileName = formatQaidaPageFileName(pageNumber);

  try{

    let pdfDocument = await pdfjsLib.getDocument(fileName).promise;
    let page = await pdfDocument.getPage(1);

    let slideShell = document.getElementById("qaidaSlideShell");
    let shellWidth = slideShell.clientWidth;
    let shellHeight = slideShell.clientHeight;

    let viewportOriginal = page.getViewport({ scale:1 });

    let widthScale = shellWidth / viewportOriginal.width;
    let heightScale = shellHeight / viewportOriginal.height;

    let finalScale = Math.min(widthScale, heightScale) * 1.02;

    let viewport = page.getViewport({ scale:finalScale });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    canvas.style.width = viewport.width + "px";
    canvas.style.height = viewport.height + "px";

    context.clearRect(0, 0, canvas.width, canvas.height);

    await page.render({
      canvasContext:context,
      viewport:viewport
    }).promise;

  }catch(error){

    console.log("Noorani Qaida render error for page " + pageNumber + ":", error);

  }

}

/* =========================
   RENDER ALL VISIBLE QAIDA PAGES
   full function name: renderAllVisibleQaidaPages
========================= */
async function renderAllVisibleQaidaPages(){

  let loadingText = document.getElementById("qaidaLoadingText");
  loadingText.style.display = "block";
  loadingText.innerHTML = "Loading page...";

  /* Arabic / Urdu book style:
     left side canvas shows NEXT page
     middle canvas shows CURRENT page
     right side canvas shows PREVIOUS page
  */
  await renderQaidaPdfToCanvas(currentQaidaPage + 1, "qaidaPrevCanvas");
  await renderQaidaPdfToCanvas(currentQaidaPage, "qaidaCurrentCanvas");
  await renderQaidaPdfToCanvas(currentQaidaPage - 1, "qaidaNextCanvas");

  loadingText.style.display = "none";

}

/* =========================
   RESET SLIDE TRACK POSITION
   full function name: resetQaidaSlideTrackPosition
========================= */
function resetQaidaSlideTrackPosition(){

  let track = document.getElementById("qaidaSlideTrack");
  track.style.transition = "none";
  track.style.transform = "translateX(-33.3333%)";

}

/* =========================
   UPDATE QAIDA PAGE UI
   full function name: updateQaidaPageUi
========================= */
function updateQaidaPageUi(){

  let badge = document.getElementById("qaidaPageBadge");
  let prevBtn = document.getElementById("qaidaPrevBtn");
  let nextBtn = document.getElementById("qaidaNextBtn");

  badge.innerHTML = currentQaidaPage + " / " + totalQaidaPages;

  prevBtn.disabled = currentQaidaPage === 1;
  nextBtn.disabled = currentQaidaPage === totalQaidaPages;

  localStorage.setItem("nooraniQaidaLastPage", currentQaidaPage);

}

/* =========================
   LOAD QAIDA PAGE
   full function name: loadQaidaPage
========================= */
async function loadQaidaPage(pageNumber){

  currentQaidaPage = getSafeQaidaPageNumber(pageNumber);

  updateQaidaPageUi();
  resetQaidaSlideTrackPosition();

  await renderAllVisibleQaidaPages();

}

/* =========================
   ANIMATE TO NEXT PAGE
   full function name: animateQaidaToNextPage
========================= */
function animateQaidaToNextPage(){

  if(currentQaidaPage >= totalQaidaPages || qaidaIsAnimating){
    snapQaidaBackToCurrentPage();
    return;
  }

  qaidaIsAnimating = true;

  let track = document.getElementById("qaidaSlideTrack");

  /* Arabic / Urdu book style:
     next page is on the LEFT side, so track moves right
  */
  track.style.transition = "transform 0.28s ease";
  track.style.transform = "translateX(0%)";

  setTimeout(async function(){

    currentQaidaPage = currentQaidaPage + 1;
    updateQaidaPageUi();

    resetQaidaSlideTrackPosition();
    await renderAllVisibleQaidaPages();

    qaidaIsAnimating = false;

  }, 290);

}

/* =========================
   ANIMATE TO PREVIOUS PAGE
   full function name: animateQaidaToPreviousPage
========================= */
function animateQaidaToPreviousPage(){

  if(currentQaidaPage <= 1 || qaidaIsAnimating){
    snapQaidaBackToCurrentPage();
    return;
  }

  qaidaIsAnimating = true;

  let track = document.getElementById("qaidaSlideTrack");

  /* Arabic / Urdu book style:
     previous page is on the RIGHT side, so track moves left
  */
  track.style.transition = "transform 0.28s ease";
  track.style.transform = "translateX(-66.6666%)";

  setTimeout(async function(){

    currentQaidaPage = currentQaidaPage - 1;
    updateQaidaPageUi();

    resetQaidaSlideTrackPosition();
    await renderAllVisibleQaidaPages();

    qaidaIsAnimating = false;

  }, 290);

}
/* =========================
   SNAP BACK TO CURRENT PAGE
   full function name: snapQaidaBackToCurrentPage
========================= */
function snapQaidaBackToCurrentPage(){

  let track = document.getElementById("qaidaSlideTrack");

  track.style.transition = "transform 0.25s ease";
  track.style.transform = "translateX(-33.3333%)";

  setTimeout(function(){
    track.style.transition = "none";
  }, 260);

}

/* =========================
   NEXT QAIDA PAGE
   full function name: nextQaidaPage
========================= */
function nextQaidaPage(){

  if(qaidaIsAnimating){
    return;
  }

  animateQaidaToNextPage();

}

/* =========================
   PREVIOUS QAIDA PAGE
   full function name: previousQaidaPage
========================= */
function previousQaidaPage(){

  if(qaidaIsAnimating){
    return;
  }

  animateQaidaToPreviousPage();

}

/* =========================
   MOVE SLIDE TRACK WITH FINGER
   full function name: moveQaidaSlideTrackWithFinger
========================= */
function moveQaidaSlideTrackWithFinger(moveX){

  let track = document.getElementById("qaidaSlideTrack");
  let screenWidth = window.innerWidth;

  let baseMove = -screenWidth;
  let finalMove = baseMove + moveX;

   /* Arabic / Urdu book style:
     page 1 cannot go previous, so left swipe is resisted
     last page cannot go next, so right swipe is resisted
  */
  if(currentQaidaPage === 1 && moveX < 0){
    finalMove = baseMove + (moveX * 0.22);
  }

  if(currentQaidaPage === totalQaidaPages && moveX > 0){
    finalMove = baseMove + (moveX * 0.22);
  }

  track.style.transition = "none";
  track.style.transform = "translateX(" + finalMove + "px)";

}

/* =========================
   HANDLE QAIDA TOUCH START
   full function name: handleQaidaTouchStart
========================= */
function handleQaidaTouchStart(event){

  if(qaidaIsAnimating){
    return;
  }

  let touch = event.touches[0];

  qaidaTouchStartX = touch.clientX;
  qaidaTouchStartY = touch.clientY;
  qaidaTouchCurrentX = touch.clientX;
  qaidaTouchCurrentY = touch.clientY;

  qaidaIsDragging = true;
  qaidaDidDrag = false;

}

/* =========================
   HANDLE QAIDA TOUCH MOVE
   full function name: handleQaidaTouchMove
========================= */
function handleQaidaTouchMove(event){

  if(!qaidaIsDragging || qaidaIsAnimating){
    return;
  }

  event.preventDefault();

  let touch = event.touches[0];

  qaidaTouchCurrentX = touch.clientX;
  qaidaTouchCurrentY = touch.clientY;

  let moveX = qaidaTouchCurrentX - qaidaTouchStartX;
  let moveY = qaidaTouchCurrentY - qaidaTouchStartY;

  if(Math.abs(moveX) > 8 && Math.abs(moveX) > Math.abs(moveY)){
    qaidaDidDrag = true;
    moveQaidaSlideTrackWithFinger(moveX);
  }

}

/* =========================
   HANDLE QAIDA TOUCH END
   full function name: handleQaidaTouchEnd
========================= */
function handleQaidaTouchEnd(event){

  if(!qaidaIsDragging || qaidaIsAnimating){
    return;
  }

  qaidaIsDragging = false;

  let moveX = qaidaTouchCurrentX - qaidaTouchStartX;
  let moveY = qaidaTouchCurrentY - qaidaTouchStartY;

  let triggerDistance = window.innerWidth * qaidaSwipeTriggerPercent;

  if(qaidaDidDrag && Math.abs(moveX) > Math.abs(moveY) && Math.abs(moveX) > triggerDistance){

     /* Arabic / Urdu book style:
       swipe right = next page
       swipe left = previous page
    */
    if(moveX > 0){
      animateQaidaToNextPage();
    }else{
      animateQaidaToPreviousPage();
    }

  }else if(qaidaDidDrag){

    snapQaidaBackToCurrentPage();

  }else{

    toggleQaidaTopBar();

  }

}

/* =========================
   HANDLE QAIDA MOUSE START
   full function name: handleQaidaMouseStart
========================= */
function handleQaidaMouseStart(event){

  if(qaidaIsAnimating){
    return;
  }

  qaidaMouseIsDown = true;

  qaidaTouchStartX = event.clientX;
  qaidaTouchStartY = event.clientY;
  qaidaTouchCurrentX = event.clientX;
  qaidaTouchCurrentY = event.clientY;

  qaidaIsDragging = true;
  qaidaDidDrag = false;

  document.addEventListener("mousemove", handleQaidaMouseMove);
  document.addEventListener("mouseup", handleQaidaMouseEnd);

}

/* =========================
   HANDLE QAIDA MOUSE MOVE
   full function name: handleQaidaMouseMove
========================= */
function handleQaidaMouseMove(event){

  if(!qaidaMouseIsDown || !qaidaIsDragging || qaidaIsAnimating){
    return;
  }

  qaidaTouchCurrentX = event.clientX;
  qaidaTouchCurrentY = event.clientY;

  let moveX = qaidaTouchCurrentX - qaidaTouchStartX;
  let moveY = qaidaTouchCurrentY - qaidaTouchStartY;

  if(Math.abs(moveX) > 8 && Math.abs(moveX) > Math.abs(moveY)){
    qaidaDidDrag = true;
    moveQaidaSlideTrackWithFinger(moveX);
  }

}

/* =========================
   HANDLE QAIDA MOUSE END
   full function name: handleQaidaMouseEnd
========================= */
function handleQaidaMouseEnd(event){

  qaidaMouseIsDown = false;

  document.removeEventListener("mousemove", handleQaidaMouseMove);
  document.removeEventListener("mouseup", handleQaidaMouseEnd);

  handleQaidaTouchEnd(event);

}

/* =========================
   TOGGLE TOP BAR
   full function name: toggleQaidaTopBar
========================= */
function toggleQaidaTopBar(){

  let topBar = document.getElementById("qaidaTopBar");
  let slideShell = document.getElementById("qaidaSlideShell");
  let bottomControls = document.getElementById("qaidaBottomControls");

  topBar.classList.toggle("show");
  slideShell.classList.toggle("shrink");
  bottomControls.classList.toggle("show");

  setTimeout(async function(){
    await renderAllVisibleQaidaPages();
  }, 320);

}

/* =========================
   GO BACK TO BOOKS PAGE
   full function name: goBackToBooksPage
========================= */
function goBackToBooksPage(){

  window.location.href = "../";

}

/* =========================
   KEYBOARD SUPPORT
   full function name: handleQaidaKeyboardControls
========================= */
function handleQaidaKeyboardControls(event){

  if(event.key === "ArrowRight"){
    nextQaidaPage();
  }

  if(event.key === "ArrowLeft"){
    previousQaidaPage();
  }

  if(event.key === "Escape"){
    goBackToBooksPage();
  }

}

/* =========================
   LOAD LAST SAVED PAGE
   full function name: loadLastSavedQaidaPage
========================= */
function loadLastSavedQaidaPage(){

  let savedPage = parseInt(localStorage.getItem("nooraniQaidaLastPage"), 10);

  if(savedPage && savedPage >= 1 && savedPage <= totalQaidaPages){
    loadQaidaPage(savedPage);
  }else{
    loadQaidaPage(1);
  }

}

/* =========================
   HANDLE SCREEN RESIZE
   full function name: handleQaidaScreenResize
========================= */
function handleQaidaScreenResize(){

  setTimeout(async function(){
    resetQaidaSlideTrackPosition();
    await renderAllVisibleQaidaPages();
  }, 300);

}

/* =========================
   PAGE START
========================= */

document.addEventListener("keydown", handleQaidaKeyboardControls);
window.addEventListener("resize", handleQaidaScreenResize);
window.addEventListener("orientationchange", handleQaidaScreenResize);

loadLastSavedQaidaPage();
</script>

</body>
</html>
