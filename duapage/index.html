<!-- =========================
     DUA CLOUD SYNC SCRIPT
     File used: shared/cloud-sync.js
========================= -->
<script type="module" src="../shared/cloud-sync.js?v=dua-cloud-1"></script>
<script>

/* =========================
   PAGE STATE
========================= */
let currentDuaSubPage = "main";
let currentDuaTab = "All";
let currentDuaId = null;
let currentFavoriteMode = false;
let currentSearchText = "";
let duaCloudAutoSaveTimer = null;
let duaCloudAutoCheckDone = false;
let duaAllowIntentionalDeleteCloudSave = false;
let duaCloudSuppressAutoSave = false;

const DUA_CLOUD_APP_NAME = "duaPage";
const DUA_DELETED_IDS_KEY = "ibadahDeletedDuaIds";



/* =========================
   OPEN DUA DIRECT CLOUD MENU
   Full function name: openDuaDirectCloudMenu()
========================= */
function openDuaDirectCloudMenu(){

  let overlay = document.getElementById("duaDirectCloudOverlay");

  if(overlay){
    overlay.style.display = "flex";
  }

  updateDuaDirectCloudStatus();

}

/* =========================
   CLOSE DUA DIRECT CLOUD MENU
   Full function name: closeDuaDirectCloudMenu()
========================= */
function closeDuaDirectCloudMenu(){

  let overlay = document.getElementById("duaDirectCloudOverlay");

  if(overlay){
    overlay.style.display = "none";
  }

}

/* =========================
   CLOSE DUA DIRECT CLOUD MENU FROM OVERLAY
   Full function name: closeDuaDirectCloudMenuFromOverlay()
========================= */
function closeDuaDirectCloudMenuFromOverlay(event){

  if(event.target && event.target.id === "duaDirectCloudOverlay"){
    closeDuaDirectCloudMenu();
  }

}

/* =========================
   UPDATE DUA DIRECT CLOUD STATUS
   Full function name: updateDuaDirectCloudStatus()
========================= */
function updateDuaDirectCloudStatus(message){

  let line = document.getElementById("duaDirectCloudStatus");

  if(!line) return;

  if(message){
    line.innerText = message;
    return;
  }

  if(!window.ibadahCloud){
    line.innerText = "Dua Cloud: Cloud file not ready yet.";
    return;
  }

  let user = null;

  try{
    if(window.ibadahCloud.getCurrentUser){
      user = window.ibadahCloud.getCurrentUser();
    }
  }catch(error){
    user = null;
  }

  if(user){
    line.innerText = "Dua Cloud: Signed in as " + (user.email || "Google user");
  }else{
    line.innerText = "Dua Cloud: Not signed in";
  }

}

/* =========================
   DUA DIRECT CLOUD SIGN IN
   Full function name: duaDirectCloudSignIn()
========================= */
async function duaDirectCloudSignIn(){

  try{

    if(!window.ibadahCloud || !window.ibadahCloud.signIn){
      updateDuaDirectCloudStatus("Cloud file is not ready yet.");
      showDuaToast("Cloud file is not ready yet");
      return;
    }

    updateDuaDirectCloudStatus("Opening Google sign-in...");

    await window.ibadahCloud.signIn();

    duaCloudAutoCheckDone = false;
    await autoCheckDuaCloud();

    updateDuaDirectCloudStatus();
    showDuaToast("Signed in");

  }catch(error){

    console.log(error);
    updateDuaDirectCloudStatus("Google sign-in failed.");
    showDuaToast("Google sign-in failed");

  }

}

/* =========================
   DUA DIRECT CLOUD SIGN OUT
   Full function name: duaDirectCloudSignOut()
========================= */
async function duaDirectCloudSignOut(){

  try{

    if(!window.ibadahCloud || !window.ibadahCloud.signOut){
      updateDuaDirectCloudStatus("Cloud file is not ready yet.");
      return;
    }

    await window.ibadahCloud.signOut();

    updateDuaDirectCloudStatus("Signed out.");
    showDuaToast("Signed out");

  }catch(error){

    console.log(error);
    updateDuaDirectCloudStatus("Sign out failed.");
    showDuaToast("Sign out failed");

  }

}

/* =========================
   DUA DIRECT CLOUD SAVE
   Full function name: duaDirectCloudSave()
========================= */
async function duaDirectCloudSave(){

  await saveDuaToCloud();

}

/* =========================
   DUA DIRECT CLOUD LOAD
   Full function name: duaDirectCloudLoad()
========================= */
async function duaDirectCloudLoad(){

  await loadDuaFromCloud();

}

/* =========================
   GET DELETED DUA IDS
   Full function name: getDeletedDuaIds()
========================= */
function getDeletedDuaIds(){

  try{
    let saved = JSON.parse(localStorage.getItem(DUA_DELETED_IDS_KEY) || "[]");
    return Array.isArray(saved) ? saved.map(String) : [];
  }catch(error){
    return [];
  }

}

/* =========================
   SAVE DELETED DUA IDS
   Full function name: saveDeletedDuaIds()
========================= */
function saveDeletedDuaIds(ids){

  let cleanIds = Array.from(new Set((Array.isArray(ids) ? ids : []).map(String).filter(Boolean)));
  localStorage.setItem(DUA_DELETED_IDS_KEY, JSON.stringify(cleanIds));
  return cleanIds;

}

/* =========================
   ADD DELETED DUA ID
   Full function name: addDeletedDuaId()
========================= */
function addDeletedDuaId(duaId){

  if(!duaId) return;

  let ids = getDeletedDuaIds();
  ids.push(String(duaId));
  saveDeletedDuaIds(ids);

}

/* =========================
   NORMALIZE CUSTOM DUA ITEM
   Full function name: normalizeCustomDuaItem()
========================= */
function normalizeCustomDuaItem(item, index){

  if(!item || typeof item !== "object") return null;

  let title = String(item.title || "").trim();

  if(!title) return null;

  let now = new Date().toISOString();

  return {
    id:String(item.id || ("custom-" + Date.now() + "-" + index)),
    source:"custom",
    type:item.type || "text",
    category:"Custom",
    icon:item.icon || "🤲",
    title:title,
    subtitle:item.subtitle || "Your custom dua",
    arabic:item.arabic || "",
    urdu:item.urdu || "",
    english:item.english || "",
    explanation:item.explanation || "",
    reference:item.reference || "",
    createdAt:item.createdAt || now,
    updatedAt:item.updatedAt || item.createdAt || now
  };

}

/* =========================
   GET DUA LOCAL CLOUD DATA
   Full function name: getDuaLocalCloudData()
========================= */
function getDuaLocalCloudData(){

  let deletedIds = getDeletedDuaIds();

  let customDuas = getCustomDuas()
    .map(function(item, index){
      return normalizeCustomDuaItem(item, index);
    })
    .filter(function(item){
      return item !== null && !deletedIds.includes(String(item.id));
    });

  let favoriteIds = getFavoriteDuaIds().filter(function(id){
    return !deletedIds.includes(String(id));
  });

  return {
    customDuas:customDuas,
    favoriteDuaIds:favoriteIds,
    deletedDuaIds:deletedIds,
    deletedIbadahIds:{
      duas:deletedIds
    },
    savedAt:new Date().toISOString(),
    source:"Ibadah Dua Page"
  };

}

/* =========================
   CLOUD HAS DUA DATA NOT ON DEVICE
   Full function name: cloudHasDuaDataNotOnDevice()
========================= */
function cloudHasDuaDataNotOnDevice(localData, cloudData){

  if(!cloudData || typeof cloudData !== "object") return false;

  let localCustomIds = {};
  let localFavoriteIds = {};
  let localDeletedIds = {};

  (localData.deletedDuaIds || []).forEach(function(id){
    localDeletedIds[String(id)] = true;
  });

  (localData.customDuas || []).forEach(function(dua){
    if(dua && dua.id){
      localCustomIds[String(dua.id)] = true;
    }
  });

  (localData.favoriteDuaIds || []).forEach(function(id){
    localFavoriteIds[String(id)] = true;
  });

  let cloudCustomDuas = Array.isArray(cloudData.customDuas) ? cloudData.customDuas : [];

  for(let i = 0; i < cloudCustomDuas.length; i++){
    let cloudDua = normalizeCustomDuaItem(cloudCustomDuas[i], i);

    if(!cloudDua || !cloudDua.id) continue;
    if(localDeletedIds[String(cloudDua.id)]) continue;

    if(!localCustomIds[String(cloudDua.id)]){
      return true;
    }
  }

  let cloudFavoriteIds = Array.isArray(cloudData.favoriteDuaIds) ? cloudData.favoriteDuaIds : [];

  for(let f = 0; f < cloudFavoriteIds.length; f++){
    let favId = String(cloudFavoriteIds[f]);

    if(localDeletedIds[favId]) continue;

    if(!localFavoriteIds[favId]){
      return true;
    }
  }

  return false;

}

/* =========================
   APPLY DUA CLOUD DATA LOCALLY
   Full function name: applyDuaCloudDataLocally()
========================= */
function applyDuaCloudDataLocally(data){

  duaCloudSuppressAutoSave = true;

  saveCustomDuas(data.customDuas || []);
  saveFavoriteDuaIds(data.favoriteDuaIds || []);
  saveDeletedDuaIds(data.deletedDuaIds || []);

  duaCloudSuppressAutoSave = false;

  renderDuaTabs();
  renderDuaList();

  if(currentDuaSubPage === "detail" && currentDuaId){
    let dua = getAllDuas().find(function(item){
      return item.id === currentDuaId;
    });

    if(dua){
      renderDuaDetailContent(dua);
    }else{
      openDuaMainPage();
    }
  }

}

/* =========================
   SCHEDULE DUA CLOUD AUTO SAVE
   Full function name: scheduleDuaCloudAutoSave()
========================= */
function scheduleDuaCloudAutoSave(){

  if(duaCloudSuppressAutoSave) return;

  if(!window.ibadahCloud) return;

  if(!window.ibadahCloud.getCurrentUser || !window.ibadahCloud.getCurrentUser()) return;

  clearTimeout(duaCloudAutoSaveTimer);

  duaCloudAutoSaveTimer = setTimeout(function(){
    saveDuaToCloud();
  }, 1800);

}

/* =========================
   SAVE DUA TO CLOUD
   Full function name: saveDuaToCloud()
========================= */
async function saveDuaToCloud(){

  try{

    if(!window.ibadahCloud){
      updateDuaDirectCloudStatus("Cloud file is not ready yet.");
      showDuaToast("Cloud file is not ready yet");
      return;
    }

    if(window.ibadahCloud.waitForAuthReady){
      await window.ibadahCloud.waitForAuthReady();
    }

    let user = window.ibadahCloud.getCurrentUser ? window.ibadahCloud.getCurrentUser() : null;

    if(!user){
      updateDuaDirectCloudStatus("Please sign in before saving Dua.");
      showDuaToast("Please sign in first");
      return;
    }

    let localData = getDuaLocalCloudData();

    updateDuaDirectCloudStatus("Checking Dua cloud...");

    let cloudData = await window.ibadahCloud.loadAppData(DUA_CLOUD_APP_NAME);

    if(cloudHasDuaDataNotOnDevice(localData, cloudData) && !duaAllowIntentionalDeleteCloudSave){
      updateDuaDirectCloudStatus("Cloud has more Dua data. Download first.");
      showDuaToast("Cloud has more Dua data");
      alert("Cloud has more Dua data than this device.\n\nPlease press Download / Load Dua first, then save again.");
      return;
    }

    updateDuaDirectCloudStatus("Saving Dua...");

    await window.ibadahCloud.saveAppData(DUA_CLOUD_APP_NAME, localData);

    duaAllowIntentionalDeleteCloudSave = false;

    updateDuaDirectCloudStatus("Dua saved to cloud.");
    showDuaToast("Dua saved");

  }catch(error){

    console.log(error);
    updateDuaDirectCloudStatus("Dua save failed.");
    showDuaToast("Dua save failed");

  }

}

/* =========================
   LOAD DUA FROM CLOUD
   Full function name: loadDuaFromCloud()
========================= */
async function loadDuaFromCloud(){

  try{

    if(!window.ibadahCloud){
      updateDuaDirectCloudStatus("Cloud file is not ready yet.");
      showDuaToast("Cloud file is not ready yet");
      return;
    }

    if(window.ibadahCloud.waitForAuthReady){
      await window.ibadahCloud.waitForAuthReady();
    }

    let user = window.ibadahCloud.getCurrentUser ? window.ibadahCloud.getCurrentUser() : null;

    if(!user){
      updateDuaDirectCloudStatus("Please sign in before loading Dua.");
      showDuaToast("Please sign in first");
      return;
    }

    updateDuaDirectCloudStatus("Loading Dua...");

    let cloudData = await window.ibadahCloud.loadAppData(DUA_CLOUD_APP_NAME);

    if(!cloudData){
      updateDuaDirectCloudStatus("No Dua cloud data found. Save first.");
      showDuaToast("No Dua cloud data found");
      return;
    }

    localStorage.setItem("ibadahDuaBackupBeforeCloudLoad", JSON.stringify(getDuaLocalCloudData()));

    let localData = getDuaLocalCloudData();

    let mergedCustomDuas = (localData.customDuas || []).concat(cloudData.customDuas || []);
    let customMap = {};

    mergedCustomDuas.forEach(function(dua, index){
      let cleanDua = normalizeCustomDuaItem(dua, index);
      if(cleanDua && cleanDua.id){
        customMap[String(cleanDua.id)] = cleanDua;
      }
    });

    let favMap = {};

    (localData.favoriteDuaIds || []).concat(cloudData.favoriteDuaIds || []).forEach(function(id){
      favMap[String(id)] = true;
    });

    let deletedIds = Array.from(new Set(
      (localData.deletedDuaIds || []).concat(cloudData.deletedDuaIds || [])
    ));

    let mergedData = {
      customDuas:Object.values(customMap).filter(function(dua){
        return !deletedIds.includes(String(dua.id));
      }),
      favoriteDuaIds:Object.keys(favMap).filter(function(id){
        return !deletedIds.includes(String(id));
      }),
      deletedDuaIds:deletedIds
    };

    applyDuaCloudDataLocally(mergedData);

    duaAllowIntentionalDeleteCloudSave = false;

    updateDuaDirectCloudStatus("Dua loaded from cloud.");
    showDuaToast("Dua loaded");

  }catch(error){

    console.log(error);
    updateDuaDirectCloudStatus("Dua load failed.");
    showDuaToast("Dua load failed");

  }

}

/* =========================
   AUTO CHECK DUA CLOUD
   Full function name: autoCheckDuaCloud()
========================= */
async function autoCheckDuaCloud(){

  try{

    if(duaCloudAutoCheckDone) return;
    if(!window.ibadahCloud) return;

    if(window.ibadahCloud.waitForAuthReady){
      await window.ibadahCloud.waitForAuthReady();
    }

    let user = window.ibadahCloud.getCurrentUser ? window.ibadahCloud.getCurrentUser() : null;

    if(!user) return;

    duaCloudAutoCheckDone = true;

    let cloudData = await window.ibadahCloud.loadAppData(DUA_CLOUD_APP_NAME);

    if(!cloudData){
      updateDuaDirectCloudStatus();
      return;
    }

    if(cloudHasDuaDataNotOnDevice(getDuaLocalCloudData(), cloudData)){
      updateDuaDirectCloudStatus("Cloud has more Dua data. Download first.");
      showDuaToast("Cloud has more Dua data");
      return;
    }

    updateDuaDirectCloudStatus();

  }catch(error){
    console.log(error);
  }

}

/* =========================
   WAIT FOR DUA CLOUD
   Full function name: waitForDuaCloud()
========================= */
function waitForDuaCloud(){

  let tries = 0;

  let timer = setInterval(function(){

    tries++;

    if(window.ibadahCloud){
      clearInterval(timer);
      autoCheckDuaCloud();
      updateDuaDirectCloudStatus();
      return;
    }

    if(tries > 40){
      clearInterval(timer);
      updateDuaDirectCloudStatus("Cloud file is not ready yet.");
    }

  }, 250);

}

/* =========================
   CLOUD USER CHANGE LISTENER
   Full listener name: ibadahCloudUserChanged
========================= */
window.addEventListener("ibadahCloudUserChanged", function(){
  duaCloudAutoCheckDone = false;
  autoCheckDuaCloud();
  updateDuaDirectCloudStatus();
});

/* =========================
   GET CUSTOM DUAS
========================= */
function getCustomDuas(){

  try{
    return JSON.parse(localStorage.getItem("ibadahCustomDuas") || "[]");
  }catch(error){
    return [];
  }

}

/* =========================
   SAVE CUSTOM DUAS
========================= */
function saveCustomDuas(customDuas){

  let cleanList = (Array.isArray(customDuas) ? customDuas : []).map(function(item, index){

    let cleanItem = normalizeCustomDuaItem(item, index);

    return cleanItem || item;

  });

  localStorage.setItem("ibadahCustomDuas", JSON.stringify(cleanList));

  scheduleDuaCloudAutoSave();

}

/* =========================
   GET ALL DUAS
========================= */
function getAllDuas(){

  let customDuas = getCustomDuas();

  return builtInDuas.concat(customDuas);

}

/* =========================
   GET FAVORITE DUAS
========================= */
function getFavoriteDuaIds(){

  try{
    return JSON.parse(localStorage.getItem("ibadahDuaFavorites") || "[]");
  }catch(error){
    return [];
  }

}

/* =========================
   SAVE FAVORITE DUAS
========================= */
function saveFavoriteDuaIds(favIds){

  let cleanFavIds = Array.from(new Set((Array.isArray(favIds) ? favIds : []).map(String).filter(Boolean)));

  localStorage.setItem("ibadahDuaFavorites", JSON.stringify(cleanFavIds));

  scheduleDuaCloudAutoSave();

}

/* =========================
   SHOW ONLY ONE PAGE
========================= */
function showOnlyDuaPage(pageId){

  let pages = document.querySelectorAll(".duaPage");

  pages.forEach(function(page){
    page.classList.remove("active");
  });

  let targetPage = document.getElementById(pageId);

  if(targetPage){
    targetPage.classList.add("active");
  }

  window.scrollTo(0,0);

}

/* =========================
   SET TOP TITLE
========================= */
function setDuaTopTitle(titleText){

  let title = document.getElementById("duaTopTitle");

  if(title){
    title.innerText = titleText;
  }

}

/* =========================
   SHOW OR HIDE TOP HEART
========================= */
function setDuaTopHeartVisible(shouldShow){

  let btn = document.getElementById("duaTopHeartBtn");

  if(!btn) return;

  btn.style.display = shouldShow ? "flex" : "none";

}

/* =========================
   RENDER DUA TABS
========================= */
function renderDuaTabs(){

  let tabs = document.getElementById("duaTabs");

  if(!tabs) return;

  tabs.innerHTML = duaCategories.map(function(category){

    let activeClass = category === currentDuaTab ? "active" : "";

    return `
      <button class="duaTabBtn ${activeClass}" onclick="selectDuaTab('${category}')">
        ${category}
      </button>
    `;

  }).join("");

}

/* =========================
   SELECT DUA TAB
========================= */
function selectDuaTab(category){

  currentDuaTab = category;
  currentFavoriteMode = false;
  currentSearchText = "";

  let searchInput = document.getElementById("duaSearchInput");

  if(searchInput){
    searchInput.value = "";
  }

  renderDuaTabs();
  renderDuaList();

}

/* =========================
   FILTER DUA CARDS
========================= */
function filterDuaCards(){

  let searchInput = document.getElementById("duaSearchInput");

  currentSearchText = searchInput ? searchInput.value.trim().toLowerCase() : "";

  renderDuaList();

}

/* =========================
   GET FILTERED DUAS
========================= */
function getFilteredDuas(){

  let allDuas = getAllDuas();
  let favIds = getFavoriteDuaIds();

  let filtered = allDuas;

  if(currentFavoriteMode){
    filtered = filtered.filter(function(dua){
      return favIds.includes(dua.id);
    });
  }else{
    if(currentDuaTab !== "All"){
      filtered = filtered.filter(function(dua){
        return dua.category === currentDuaTab;
      });
    }
  }

  if(currentSearchText){
    filtered = filtered.filter(function(dua){

      let searchArea = [
        dua.title || "",
        dua.subtitle || "",
        dua.category || "",
        dua.arabic || "",
        dua.urdu || "",
        dua.english || "",
        dua.explanation || "",
        dua.reference || ""
      ].join(" ").toLowerCase();

      return searchArea.includes(currentSearchText);

    });
  }

  return filtered;

}

/* =========================
   RENDER DUA LIST
========================= */
function renderDuaList(){

  let list = document.getElementById("duaList");

  if(!list) return;

  let duasToShow = getFilteredDuas();
  let favIds = getFavoriteDuaIds();

  let html = "";

  if(currentDuaTab === "Custom" && currentFavoriteMode === false){
    html += `
      <div class="addCustomDuaCard" onclick="openCustomDuaFormPage()">
        <div class="duaOptionLeft">
          <div class="addCustomDuaIcon">＋</div>
          <div class="duaOptionTextBox">
            <div class="addCustomDuaTitle">Add Custom Dua</div>
            <div class="addCustomDuaSub">Save your own personal dua</div>
          </div>
        </div>
        <div class="duaOptionArrow" style="color:rgba(255,255,255,0.7);">›</div>
      </div>
    `;
  }

  if(duasToShow.length === 0){

    html += `
      <div class="emptyDuaBox">
        <div class="emptyDuaIcon">🤲</div>
        <div class="emptyDuaTitle">No duas found</div>
        <div class="emptyDuaText">Try another tab or add your own dua in Custom.</div>
      </div>
    `;

    list.innerHTML = html;
    return;

  }

  html += duasToShow.map(function(dua){

    let isFav = favIds.includes(dua.id);

    return `
      <div class="duaOptionCard" onclick="openDuaDetailPage('${dua.id}')">
        <div class="duaOptionLeft">
          <div class="duaOptionIcon">${dua.icon || "🤲"}</div>
          <div class="duaOptionTextBox">
            <div class="duaOptionTitle">${escapeHtml(dua.title || "Dua")}</div>
            <div class="duaOptionSub">${escapeHtml(dua.subtitle || dua.category || "")}</div>
          </div>
        </div>

        <button
          class="duaFavSmallBtn ${isFav ? "on" : ""}"
          onclick="event.stopPropagation(); toggleDuaFavorite('${dua.id}')"
        >
          ${isFav ? "❤️" : "🤍"}
        </button>

        <div class="duaOptionArrow">›</div>
      </div>
    `;

  }).join("");

  list.innerHTML = html;

}

/* =========================
   OPEN DUA DETAIL PAGE
========================= */
function openDuaDetailPage(duaId){

  let dua = getAllDuas().find(function(item){
    return item.id === duaId;
  });

  if(!dua){
    openDuaMainPage();
    return;
  }

  currentDuaSubPage = "detail";
  currentDuaId = duaId;

  setDuaTopTitle(dua.title || "Dua");
  setDuaTopHeartVisible(false);

  renderDuaDetailContent(dua);

  showOnlyDuaPage("duaDetailPage");

}

/* =========================
   RENDER DUA DETAIL CONTENT
========================= */

  let detailBox = document.getElementById("duaDetailContent");

  if(!detailBox) return;

  let favoriteIds = getFavoriteDuaIds();
  let isFav = favoriteIds.includes(dua.id);

  let html = `
    <div class="duaDetailCard">
      <div class="duaDetailTitle">${escapeHtml(dua.title || "Dua")}</div>
      <div class="duaDetailSub">${escapeHtml(dua.category || "")}</div>
  `;

  if(dua.images && dua.images.length > 0){

    dua.images.forEach(function(imageSrc){
      html += `
        <img class="duaImage" src="${imageSrc}" alt="${escapeHtml(dua.title || "Dua")}">
        <br>
      `;
    });

  }

  html += `</div>`;

  if(dua.arabic){
    html += `
      <div class="textCard">
        <div class="textCardTitle">Arabic</div>
        <div class="textCardArabic">${escapeHtml(dua.arabic)}</div>
      </div>
    `;
  }

  if(dua.urdu){
    html += `
      <div class="textCard">
        <div class="textCardTitle">Urdu Translation</div>
        <div class="textCardUrdu">${escapeHtml(dua.urdu)}</div>
      </div>
    `;
  }

  if(dua.english){
    html += `
      <div class="textCard">
        <div class="textCardTitle">English Translation</div>
        <div class="textCardEnglish">${escapeHtml(dua.english)}</div>
      </div>
    `;
  }

  if(dua.explanation){
    html += `
      <div class="textCard">
        <div class="textCardTitle">Tafsir / Explanation</div>
        <div class="textCardUrdu">${escapeHtml(dua.explanation)}</div>
        ${dua.reference ? `<div class="textCardReference">${escapeHtml(dua.reference)}</div>` : ""}
      </div>
    `;
  }else{
    if(dua.reference){
      html += `
        <div class="textCard">
          <div class="textCardTitle">Reference</div>
          <div class="textCardReference">${escapeHtml(dua.reference)}</div>
        </div>
      `;
    }
  }

  html += `
    <div class="duaActionRow">
      <button class="duaActionBtn duaCopyBtn" onclick="copyCurrentDua()">
        📋 Copy
      </button>

      <button class="duaActionBtn duaShareBtn" onclick="shareCurrentDua()">
        🔗 Share
      </button>
    </div>

    <div class="duaActionRow">
      <button class="duaActionBtn ${isFav ? "duaDeleteBtn" : "duaShareBtn"}" onclick="toggleDuaFavorite('${dua.id}')">
        ${isFav ? "❤️ Remove Favorite" : "🤍 Add Favorite"}
      </button>
    </div>
  `;

  if(dua.source === "custom"){
    html += `
      <div class="duaActionRow">
        <button class="duaActionBtn duaDeleteBtn" onclick="deleteCustomDua('${dua.id}')">
          🗑️ Delete Custom Dua
        </button>
      </div>
    `;
  }

  detailBox.innerHTML = html;

}

/* =========================
   OPEN CUSTOM DUA FORM PAGE
========================= */
function openCustomDuaFormPage(){

  currentDuaSubPage = "customForm";

  setDuaTopTitle("Add Custom Dua");
  setDuaTopHeartVisible(false);

  document.getElementById("customDuaTitleInput").value = "";
  document.getElementById("customDuaArabicInput").value = "";
  document.getElementById("customDuaUrduInput").value = "";
  document.getElementById("customDuaEnglishInput").value = "";
  document.getElementById("customDuaReferenceInput").value = "";

  showOnlyDuaPage("customDuaFormPage");

}

/* =========================
   SAVE CUSTOM DUA FROM FORM
========================= */
function saveCustomDuaFromForm(){

  let title = document.getElementById("customDuaTitleInput").value.trim();
  let arabic = document.getElementById("customDuaArabicInput").value.trim();
  let urdu = document.getElementById("customDuaUrduInput").value.trim();
  let english = document.getElementById("customDuaEnglishInput").value.trim();
  let reference = document.getElementById("customDuaReferenceInput").value.trim();

  if(!title){
    showDuaToast("Please write a title");
    return;
  }

  if(!arabic && !urdu && !english){
    showDuaToast("Please write at least Arabic, Urdu, or English");
    return;
  }

  let customDuas = getCustomDuas();

  let newDua = {
    id:"custom-" + Date.now(),
    source:"custom",
    type:"text",
    category:"Custom",
    icon:"🤲",
    title:title,
    subtitle:"Your custom dua",
    arabic:arabic,
    urdu:urdu,
    english:english,
    explanation:"",
    reference:reference
  };

  customDuas.unshift(newDua);

  saveCustomDuas(customDuas);

  currentDuaTab = "Custom";
  currentFavoriteMode = false;

  showDuaToast("Custom dua saved");

  openDuaMainPage();

}

/* =========================
   DELETE CUSTOM DUA
========================= */
function deleteCustomDua(duaId){

  let confirmDelete = confirm("Delete this custom dua?");

  if(!confirmDelete) return;

  addDeletedDuaId(duaId);
  duaAllowIntentionalDeleteCloudSave = true;

  let customDuas = getCustomDuas().filter(function(dua){
    return dua.id !== duaId;
  });

  saveCustomDuas(customDuas);

  let favIds = getFavoriteDuaIds().filter(function(id){
    return id !== duaId;
  });

  saveFavoriteDuaIds(favIds);

  showDuaToast("Custom dua deleted");

  currentDuaTab = "Custom";
  currentFavoriteMode = false;

  openDuaMainPage();

}

/* =========================
   TOGGLE DUA FAVORITE
========================= */
function toggleDuaFavorite(duaId){

  let favIds = getFavoriteDuaIds();
  let index = favIds.indexOf(duaId);

   if(index === -1){
    favIds.push(duaId);
    showDuaToast("Added to favorites");
  }else{
    duaAllowIntentionalDeleteCloudSave = true;
    favIds.splice(index, 1);
    showDuaToast("Removed from favorites");
  }

  saveFavoriteDuaIds(favIds);

  if(currentDuaSubPage === "detail" && currentDuaId){
    let dua = getAllDuas().find(function(item){
      return item.id === currentDuaId;
    });

    if(dua){
      renderDuaDetailContent(dua);
    }
  }else{
    renderDuaList();
  }

}

/* =========================
   SHOW FAVORITE DUAS
========================= */
function showFavoriteDuas(){

  currentFavoriteMode = true;
  currentDuaTab = "All";
  currentSearchText = "";

  let searchInput = document.getElementById("duaSearchInput");

  if(searchInput){
    searchInput.value = "";
  }

  setDuaTopTitle("❤️ Favorite Duas");

  renderDuaTabs();
  renderDuaList();

}

/* =========================
   COPY CURRENT DUA
========================= */
function copyCurrentDua(){

  let dua = getAllDuas().find(function(item){
    return item.id === currentDuaId;
  });

  if(!dua) return;

  let text = buildDuaShareText(dua);

  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){
      showDuaToast("Copied");
    });
  }else{
    showDuaToast("Copy not supported");
  }

}

/* =========================
   SHARE CURRENT DUA
========================= */
function shareCurrentDua(){

  let dua = getAllDuas().find(function(item){
    return item.id === currentDuaId;
  });

  if(!dua) return;

  let text = buildDuaShareText(dua);

  if(navigator.share){
    navigator.share({
      title:dua.title || "Dua",
      text:text
    });
  }else{
    copyCurrentDua();
  }

}

/* =========================
   BUILD DUA SHARE TEXT
========================= */
function buildDuaShareText(dua){

  let parts = [];

  if(dua.title) parts.push(dua.title);
  if(dua.arabic) parts.push(dua.arabic);
  if(dua.urdu) parts.push(dua.urdu);
  if(dua.english) parts.push(dua.english);
  if(dua.explanation) parts.push(dua.explanation);
  if(dua.reference) parts.push(dua.reference);

  if(parts.length === 1 && dua.images && dua.images.length > 0){
    parts.push("This dua is saved as an image inside the Ibadah app.");
  }

  return parts.join("\n\n");

}

/* =========================
   OPEN MAIN PAGE
========================= */
function openDuaMainPage(){

  currentDuaSubPage = "main";
  currentDuaId = null;

  if(currentFavoriteMode){
    setDuaTopTitle("❤️ Favorite Duas");
  }else{
    setDuaTopTitle("🤲 Masnoon Dua");
  }

  setDuaTopHeartVisible(true);

  renderDuaTabs();
  renderDuaList();

  showOnlyDuaPage("duaMainPage");

}

/* =========================
   GET RETURN SOURCE
========================= */
function getDuaReturnSource(){

  let params = new URLSearchParams(window.location.search);

  let from = params.get("from");

  if(from === "more") return "more";
  if(from === "home") return "home";
  if(from === "tracker") return "tracker";
  if(from === "salah") return "salah";

  return "home";

}

/* =========================
   HANDLE BACK
========================= */
function handleDuaBack(){

  if(currentDuaSubPage !== "main"){
    openDuaMainPage();
    return;
  }

  let from = getDuaReturnSource();

  localStorage.setItem("ibadahFolderReturnPage", from);

  window.location.href = "../";

}

/* =========================
   SHOW DUA TOAST
========================= */
function showDuaToast(message){

  let toast = document.getElementById("duaToast");

  if(!toast) return;

  toast.innerText = message;
  toast.classList.add("show");

  setTimeout(function(){
    toast.classList.remove("show");
  }, 2500);

}

/* =========================
   ESCAPE HTML
========================= */
function escapeHtml(text){

  if(text === null || text === undefined) return "";

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* =========================
   LOAD PAGE
========================= */
function loadDuaPage(){

  currentDuaTab = "All";
  currentFavoriteMode = false;
  currentSearchText = "";

  openDuaMainPage();
  waitForDuaCloud();

}

loadDuaPage();
</script>
