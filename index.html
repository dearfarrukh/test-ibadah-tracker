<!DOCTYPE html>
<html lang="en">
<head>

<!-- =========================
     MAIN INDEX CLEAN STARTER
     File: test-ibadah-tracker/index.html
========================= -->

<meta charset="UTF-8">
<title>Ibadah Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9e9ee">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* =========================
   CLEAN BASIC RESET
========================= */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
  background:#e9e9ee;
  color:#111;
}

/* =========================
   CLEAN APP LOADER PAGE
========================= */
.cleanAppShell{
  width:100%;
  min-height:100vh;
  background:#e9e9ee;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8%;
}

.cleanCard{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,0.88);
  border-radius:32px;
  padding:28px 22px;
  box-shadow:0 16px 38px rgba(0,0,0,0.10);
  text-align:center;
  border:1px solid rgba(255,255,255,0.75);
}

.cleanLogo{
  width:24%;
  max-width:86px;
  min-width:62px;
  aspect-ratio:1 / 1;
  object-fit:contain;
  margin-bottom:14px;
}

.cleanTitle{
  font-size:26px;
  font-weight:900;
  letter-spacing:-0.4px;
  margin-bottom:8px;
}

.cleanSub{
  font-size:15px;
  font-weight:650;
  color:#666;
  line-height:1.5;
  margin-bottom:20px;
}

.cleanButton{
  width:100%;
  border:none;
  border-radius:22px;
  padding:16px 14px;
  font-size:18px;
  font-weight:850;
  cursor:pointer;
  margin-top:10px;
}

.cleanButtonBlack{
  background:#111;
  color:white;
}

.cleanButtonLight{
  background:#f2f2f7;
  color:#111;
}

.cleanSmallText{
  font-size:13px;
  font-weight:650;
  color:#777;
  line-height:1.45;
  margin-top:14px;
}
</style>

</head>

<body>

<!-- =========================
     CLEAN LOADING SCREEN
========================= -->
<div id="cleanLoadingPage" class="cleanAppShell">
  <div class="cleanCard">

    <img class="cleanLogo" src="Images/Icons/QuranTracker.png" onerror="this.style.display='none'">

    <div class="cleanTitle">Ibadah Tracker</div>

    <div id="cleanStatusText" class="cleanSub">
      Opening your saved default page...
    </div>

    <button class="cleanButton cleanButtonBlack" onclick="openSelectedDefaultPage()">
      Open App
    </button>

    <button class="cleanButton cleanButtonLight" onclick="openAppSettingsPage()">
      App Settings
    </button>

    <div class="cleanSmallText">
      Clean main index. Settings now open from separate appsettings folder.
    </div>

  </div>
</div>

<script>
/* =========================
   REGISTER SERVICE WORKER
   Full function name: registerIbadahServiceWorker()
========================= */
function registerIbadahServiceWorker(){

  if(!("serviceWorker" in navigator)) return;

  window.addEventListener("load", function(){

    navigator.serviceWorker.register("./sw.js")
      .then(function(){
        console.log("Service worker registered");
      })
      .catch(function(error){
        console.log("Service worker registration failed:", error);
      });

  });

}

registerIbadahServiceWorker();

/* =========================
   GET IBADAH BASE PATH
   Full function name: getIbadahBasePath()
========================= */
function getIbadahBasePath(){

  if(window.location.pathname.includes("/test-ibadah-tracker/")){
    return "/test-ibadah-tracker/";
  }

  if(window.location.pathname.includes("/ibadah-tracker/")){
    return "/ibadah-tracker/";
  }

  return "/";

}

/* =========================
   GET DEFAULT PAGE
   Full function name: getDefaultPage()
========================= */
function getDefaultPage(){

  let saved = localStorage.getItem("defaultPage");

  if(!saved){
    localStorage.setItem("defaultPage", "home");
    return "home";
  }

  saved = String(saved).trim().toLowerCase();

  if(
    saved !== "home" &&
    saved !== "tracker" &&
    saved !== "salah" &&
    saved !== "more" &&
    saved !== "quran"
  ){
    localStorage.setItem("defaultPage", "home");
    return "home";
  }

  return saved;

}

/* =========================
   CLEAR ONE-TIME RETURN KEYS
   Full function name: clearOneTimeReturnKeys()
========================= */
function clearOneTimeReturnKeys(){

  localStorage.removeItem("ibadahFolderReturnPage");
  localStorage.removeItem("qazaReturnPage");
  localStorage.removeItem("tasbihReturnPage");
  localStorage.removeItem("appSettingsReturnPage");
  localStorage.removeItem("ibadahOpenAppSettings");

}

/* =========================
   SHOULD USE FOLDER RETURN KEYS
   Full function name: shouldUseFolderReturnKeys()
========================= */
function shouldUseFolderReturnKeys(){

  let params = new URLSearchParams(window.location.search);

  if(params.get("forceDefault") === "1"){
    return false;
  }

  let ref = String(document.referrer || "").toLowerCase();

  if(!ref){
    return false;
  }

  let folderNames = [
    "/home/",
    "/tracker/",
    "/salah/",
    "/more/",
    "/quran/",
    "/tasbih/",
    "/qazatracker/",
    "/duapage/",
    "/dailyazkar/",
    "/qibla/",
    "/books/",
    "/appsettings/",
    "/16linequranpages/",
    "/arabic-quran/",
    "/quranpages/"
  ];

  return folderNames.some(function(folderName){
    return ref.includes(folderName);
  });

}

/* =========================
   OPEN SAVED DEFAULT PAGE ONLY
   Full function name: openSavedDefaultPageOnly()
========================= */
function openSavedDefaultPageOnly(){

  let defaultPage = getDefaultPage();

  if(defaultPage === "tracker"){
    openTrackerPage();
    return;
  }

  if(defaultPage === "salah"){
    openSalahPage();
    return;
  }

  if(defaultPage === "more"){
    openMorePage();
    return;
  }

  if(defaultPage === "quran"){
    openQuranPage();
    return;
  }

  openHomePage();

}

/* =========================
   OPEN SELECTED DEFAULT PAGE
   Full function name: openSelectedDefaultPage()
========================= */
function openSelectedDefaultPage(){

  let status = document.getElementById("cleanStatusText");
  if(status){
    status.innerText = "Opening...";
  }

  /*
    Powerful default page rule:
    Normal app open or forceDefault=1 always opens saved default page.
  */
  if(!shouldUseFolderReturnKeys()){
    clearOneTimeReturnKeys();
    openSavedDefaultPageOnly();
    return;
  }

  /*
    Folder return only works when user really came from a folder page.
  */
  let folderReturnPage = localStorage.getItem("ibadahFolderReturnPage");

  if(folderReturnPage){
    localStorage.removeItem("ibadahFolderReturnPage");

    folderReturnPage = String(folderReturnPage).trim().toLowerCase();

    if(folderReturnPage === "home"){
      openHomePage();
      return;
    }

    if(folderReturnPage === "more"){
      openMorePage();
      return;
    }

    if(folderReturnPage === "tracker"){
      openTrackerPage();
      return;
    }

    if(folderReturnPage === "salah"){
      openSalahPage();
      return;
    }

    if(folderReturnPage === "quran"){
      openQuranPage();
      return;
    }
  }

  let qazaReturnPage = localStorage.getItem("qazaReturnPage");

  if(qazaReturnPage){
    localStorage.removeItem("qazaReturnPage");

    qazaReturnPage = String(qazaReturnPage).trim().toLowerCase();

    if(qazaReturnPage === "home"){
      openHomePage();
      return;
    }

    if(qazaReturnPage === "more"){
      openMorePage();
      return;
    }

    if(qazaReturnPage === "tracker"){
      openTrackerPage();
      return;
    }
  }

  let tasbihReturnPage = localStorage.getItem("tasbihReturnPage");

  if(tasbihReturnPage){
    localStorage.removeItem("tasbihReturnPage");

    tasbihReturnPage = String(tasbihReturnPage).trim().toLowerCase();

    if(tasbihReturnPage === "home"){
      openHomePage();
      return;
    }

    if(tasbihReturnPage === "more"){
      openMorePage();
      return;
    }
  }

  openSavedDefaultPageOnly();

}

/* =========================
   OPEN HOME PAGE
   Full function name: openHomePage()
========================= */
function openHomePage(){

  window.location.href = getIbadahBasePath() + "home/";

}

/* =========================
   OPEN TRACKER PAGE
   Full function name: openTrackerPage()
========================= */
function openTrackerPage(){

  window.location.href = getIbadahBasePath() + "tracker/";

}

/* =========================
   OPEN SALAH PAGE
   Full function name: openSalahPage()
========================= */
function openSalahPage(){

  window.location.href = getIbadahBasePath() + "salah/";

}

/* =========================
   OPEN MORE PAGE
   Full function name: openMorePage()
========================= */
function openMorePage(){

  window.location.href = getIbadahBasePath() + "more/";

}

/* =========================
   OPEN QURAN PAGE
   Full function name: openQuranPage()
========================= */
function openQuranPage(){

  window.location.href = getIbadahBasePath() + "quran/?from=main";

}

/* =========================
   OPEN TASBIH PAGE FROM HOME
   Full function name: openTasbihPageFromHome()
========================= */
function openTasbihPageFromHome(){

  window.location.href = getIbadahBasePath() + "tasbih/?from=home";

}

/* =========================
   OPEN QAZA TRACKER FROM HOME
   Full function name: openQazaTrackerFromHome()
========================= */
function openQazaTrackerFromHome(){

  localStorage.setItem("qazaReturnPage", "home");
  window.location.href = getIbadahBasePath() + "qazatracker/";

}

/* =========================
   OPEN DUA PAGE FROM HOME
   Full function name: openDuaPageFromHome()
========================= */
function openDuaPageFromHome(){

  window.location.href = getIbadahBasePath() + "duapage/?from=home&v=" + Date.now();

}

/* =========================
   OPEN DAILY AZKAR PAGE FROM HOME
   Full function name: openDailyAzkarPageFromHome()
========================= */
function openDailyAzkarPageFromHome(){

  window.location.href = getIbadahBasePath() + "dailyazkar/?from=home&v=" + Date.now();

}

/* =========================
   OPEN QIBLA PAGE
   Full function name: openQiblaPage()
========================= */
function openQiblaPage(){

  window.location.href = getIbadahBasePath() + "qibla/";

}

/* =========================
   OPEN APP SETTINGS PAGE
   Full function name: openAppSettingsPage()
========================= */
function openAppSettingsPage(){

  clearOneTimeReturnKeys();

  window.location.href = getIbadahBasePath() + "appsettings/?from=main&v=" + Date.now();

}

/* =========================
   REFRESH APP
   Full function name: refreshApp()
========================= */
async function refreshApp(){

  clearOneTimeReturnKeys();

  try{

    if("serviceWorker" in navigator){
      let registrations = await navigator.serviceWorker.getRegistrations();

      for(let registration of registrations){
        if(registration && registration.update){
          await registration.update();
        }
      }
    }

  }catch(error){
    console.log("Refresh update failed:", error);
  }

  window.location.href = getIbadahBasePath() + "?forceDefault=1&v=" + Date.now();

}

/* =========================
   CLEAN STARTUP
   Full function name: cleanStartup()
========================= */
function cleanStartup(){

  /*
    Old setting key support:
    If any old page still sends ibadahOpenAppSettings=yes,
    send user to the new separate appsettings folder.
  */
  let shouldOpenSettings = localStorage.getItem("ibadahOpenAppSettings") === "yes";

  if(shouldOpenSettings){
    localStorage.removeItem("ibadahOpenAppSettings");
    window.location.href = getIbadahBasePath() + "appsettings/?from=main&v=" + Date.now();
    return;
  }

  openSelectedDefaultPage();

}

document.addEventListener("DOMContentLoaded", cleanStartup);
</script>

</body>
</html>
